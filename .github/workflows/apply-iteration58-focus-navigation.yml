name: Apply Iteration 58 focus navigation

on:
  push:
    branches:
      - agent/iteration-58-long-term-scale-recovery
    paths:
      - '.github/workflows/apply-iteration58-focus-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-iteration-58-focus-navigation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply and validate focus navigation
        shell: bash
        run: |
          set -euo pipefail
          python .iteration58-focus-patch.py
          git diff --check
          pwsh -NoLogo -NoProfile -File tests/developer_b/validate_long_term_scale_recovery.ps1

      - name: Commit production focus navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/protected_main_menu.gd tests/developer_b/validate_long_term_scale_recovery.ps1 tests/qa/ultrawide_high_dpi_controller_focus_desktop_acceptance.gd
          git commit -m 'fix: add bounded real-controller focus traversal'
          git push origin HEAD:agent/iteration-58-long-term-scale-recovery
