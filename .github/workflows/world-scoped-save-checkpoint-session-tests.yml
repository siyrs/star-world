name: World-scoped save checkpoint session quality gates

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: world-scoped-save-checkpoint-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Cross-world and same-world entry checkpoint isolation
      domain_timeout_minutes: 70
      static_validators: |
        tests/developer_b/validate_world_scoped_save_checkpoint_sessions.ps1
        tests/developer_b/validate_save_checkpoint_timeline.ps1
        tests/developer_b/validate_runtime_health_report.ps1
      primary_headless_script: res://tests/qa/world_scoped_save_checkpoint_session_regression.gd
      primary_headless_output_base: build\world-scoped-save-checkpoint-session-runtime
      primary_headless_timeout_milliseconds: 600000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/save_checkpoint_timeline_regression.gd
        res://tests/qa/bounded_autosave_runtime_regression.gd
        res://tests/qa/runtime_health_report_regression.gd
        res://tests/qa/runtime_health_failed_return_regression.gd
        res://tests/qa/ui_layout_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: world-scoped-save-checkpoint-session-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/world-scoped-save-checkpoint-session-runtime.stdout.log
        build/world-scoped-save-checkpoint-session-runtime.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real A to B to A checkpoint session isolation
      desktop_timeout_minutes: 90
      desktop_script: res://tests/qa/world_scoped_save_checkpoint_session_desktop_acceptance.gd
      desktop_output_path: build\save-checkpoint-session-isolation.png
      desktop_timeout_milliseconds: 900000
      desktop_artifact_name: world-scoped-save-checkpoint-session-evidence
      desktop_artifact_paths: |
        build/save-checkpoint-session-isolation.png
        build/save-checkpoint-same-world-reentry.png
        build/save-checkpoint-session-isolation.json
        build/save-checkpoint-session-isolation.stdout.log
        build/save-checkpoint-session-isolation.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 14
