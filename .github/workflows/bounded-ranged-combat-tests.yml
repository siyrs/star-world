name: Bounded ranged combat quality gates

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: bounded-ranged-combat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Atomic ranged data, shared projectile runtime, authoritative hits and input parity
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_data.ps1
        tests/developer_b/validate_bounded_ranged_combat.ps1
      primary_headless_script: res://tests/qa/ranged_combat_runtime_regression.gd
      primary_headless_output_base: build\ranged-combat-runtime
      primary_headless_timeout_milliseconds: 900000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/ranged_combat_registry_regression.gd
        res://tests/qa/equipment_combat_regression.gd
        res://tests/qa/combat_cadence_regression.gd
        res://tests/qa/controller_gameplay_regression.gd
        res://tests/qa/inventory_transaction_regression.gd
        res://tests/qa/runtime_soak_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: bounded-ranged-combat-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/ranged-combat-runtime.stdout.log
        build/ranged-combat-runtime.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real mouse and controller charge, projectile hit, save and reload
      desktop_timeout_minutes: 120
      desktop_script: res://tests/qa/ranged_combat_desktop_acceptance.gd
      desktop_output_path: build\ranged-combat-charge.png
      desktop_timeout_milliseconds: 1200000
      desktop_artifact_name: bounded-ranged-combat-evidence
      desktop_artifact_paths: |
        build/ranged-combat-charge.png
        build/ranged-combat-hit.png
        build/ranged-combat-report.json
        build/ranged-combat-charge.stdout.log
        build/ranged-combat-charge.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 14
