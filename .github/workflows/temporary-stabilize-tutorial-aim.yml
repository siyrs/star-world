name: Temporary stabilize tutorial aim

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/temporary-stabilize-tutorial-aim.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-readiness-closure
          fetch-depth: 0

      - name: Stabilize production player yaw and pitch
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/qa/tutorial_placement_desktop_acceptance.gd')
          text = path.read_text(encoding='utf-8')

          old_placement = '''\thub.inventory.select_slot(0)
\tcamera.look_at(camera.global_position + Vector3(0.0, 0.0, -3.0), Vector3.UP)
\tvar ray := player.get_node_or_null("CameraPivot/Camera3D/InteractionRay") as RayCast3D
\tif ray != null:
\t\tray.force_raycast_update()
\tplayer.call("_update_interaction_focus", true)
\tawait process_frame
'''
          new_placement = '''\thub.inventory.select_slot(0)
\tawait _aim_at(
\t\tplayer,
\t\tcamera.global_position + Vector3(0.0, 0.0, -3.0)
\t)
'''
          if old_placement not in text:
              raise SystemExit('placement aim block not found')
          text = text.replace(old_placement, new_placement, 1)

          old_helper = '''func _aim_at(player: Node3D, target: Vector3) -> void:
\tvar camera: Camera3D = player.call("get_view_camera")
\tif camera != null:
\t\tcamera.look_at(target, Vector3.UP)
\tawait physics_frame
\tawait process_frame
\tvar ray := player.get_node_or_null("CameraPivot/Camera3D/InteractionRay") as RayCast3D
\tif ray != null:
\t\tray.force_raycast_update()
\tplayer.call("_update_interaction_focus", true)
\tawait process_frame
'''
          new_helper = '''func _aim_at(player: Node3D, target: Vector3) -> void:
\tvar camera: Camera3D = player.call("get_view_camera") as Camera3D
\tvar pivot := player.get_node_or_null("CameraPivot") as Node3D
\tvar ray := player.get_node_or_null(
\t\t"CameraPivot/Camera3D/InteractionRay"
\t) as RayCast3D
\tif camera == null or pivot == null or ray == null:
\t\treturn
\t# Production input rotates the body yaw and CameraPivot pitch. Writing only a
\t# transient Camera3D look_at transform is overwritten on later physics frames,
\t# which cancels hold-to-harvest after the first focus sample.
\tvar direction := target - camera.global_position
\tvar horizontal := Vector2(direction.x, direction.z).length()
\tplayer.rotation.y = atan2(-direction.x, -direction.z)
\tpivot.rotation.x = clampf(
\t\tatan2(direction.y, maxf(0.0001, horizontal)),
\t\tdeg_to_rad(-89.0),
\t\tdeg_to_rad(89.0)
\t)
\tcamera.rotation = Vector3.ZERO
\tawait physics_frame
\tawait process_frame
\tray.force_raycast_update()
\tplayer.call("_update_interaction_focus", true)
\tawait process_frame
'''
          if old_helper not in text:
              raise SystemExit('aim helper not found')
          text = text.replace(old_helper, new_helper, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-stabilize-tutorial-aim.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/qa/tutorial_placement_desktop_acceptance.gd
          git commit -m 'test: stabilize tutorial mining and placement aim'
          git push origin HEAD:agent/release-readiness-closure
