name: Apply Iteration 58 production integration

on:
  push:
    branches:
      - agent/iteration-58-long-term-scale-recovery
    paths:
      - '.github/workflows/apply-iteration58.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-iteration-58
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply catalog transaction marker and iteration integration
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > "$RUNNER_TEMP/apply_iteration58.py"
          echo 'ce8db1e6f3d4cab9e0c5849c7806dc15050e3108abd2f58bf11682dd81c4141e  '"$RUNNER_TEMP/apply_iteration58.py" | sha256sum --check --status
          python "$RUNNER_TEMP/apply_iteration58.py"
          git diff --check
          pwsh -NoLogo -NoProfile -File tests/developer_b/validate_long_term_scale_recovery.ps1

      - name: Commit Iteration 58 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/save/save_service.gd tests/run_all.ps1 docs/PRODUCT_ROADMAP.md qa/issues-found.md
          git commit -m 'feat: add crash-safe catalog transaction recovery'
          git push origin HEAD:agent/iteration-58-long-term-scale-recovery
