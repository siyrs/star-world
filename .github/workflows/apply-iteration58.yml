name: Apply Iteration 58 production integration

on:
  push:
    branches:
      - agent/iteration-58-long-term-scale-recovery
    paths:
      - '.github/workflows/apply-iteration58.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-iteration-58
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply catalog transaction marker and iteration integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          save = Path('src/save/save_service.gd')
          replace_once(
              save,
              'const CATALOG_FILE_NAME := "catalog.json"\nconst MAX_PRIMARY_REPAIRS_PER_LIST := 8',
              'const CATALOG_FILE_NAME := "catalog.json"\nconst CATALOG_PENDING_FILE_NAME := "catalog.pending"\nconst MAX_PRIMARY_REPAIRS_PER_LIST := 8',
          )
          replace_once(
              save,
              'var _catalog_write_failure_count := 0\nvar _last_catalog_world_count := 0',
              'var _catalog_write_failure_count := 0\nvar _catalog_pending_marker_write_failure_count := 0\nvar _catalog_pending_marker_clear_failure_count := 0\nvar _catalog_pending_marker_detected_count := 0\nvar _last_catalog_pending_marker_detected_count := 0\nvar _last_catalog_world_count := 0',
          )
          replace_once(
              save,
              '\tvar world_path := _world_path(world_id)\n\tif not _store.write_dictionary(world_path, payload):\n\t\tsave_failed.emit(world_id, "write_failed")\n\t\treturn false\n\tvar save_bytes := _file_size(world_path)',
              '\tvar pending_marker_ready := _mark_catalog_pending(world_id)\n\tif not pending_marker_ready:\n\t\t_catalog_pending_marker_write_failure_count += 1\n\tvar world_path := _world_path(world_id)\n\tif not _store.write_dictionary(world_path, payload):\n\t\tif pending_marker_ready and not _clear_catalog_pending(world_id):\n\t\t\t_catalog_pending_marker_clear_failure_count += 1\n\t\tsave_failed.emit(world_id, "write_failed")\n\t\treturn false\n\tvar save_bytes := _file_size(world_path)',
          )
          replace_once(
              save,
              'func list_worlds() -> Array:\n\t_ensure_directory(WORLDS_DIR)\n\tvar started_at := Time.get_ticks_usec()\n\tvar result: Array = []',
              'func list_worlds() -> Array:\n\t_ensure_directory(WORLDS_DIR)\n\tvar started_at := Time.get_ticks_usec()\n\t_last_catalog_pending_marker_detected_count = 0\n\tvar result: Array = []',
          )
          replace_once(
              save,
              '\t\t"write_failure_count": _catalog_write_failure_count,\n\t\t"last_world_count": _last_catalog_world_count,',
              '\t\t"write_failure_count": _catalog_write_failure_count,\n\t\t"pending_marker_write_failure_count": (\n\t\t\t_catalog_pending_marker_write_failure_count\n\t\t),\n\t\t"pending_marker_clear_failure_count": (\n\t\t\t_catalog_pending_marker_clear_failure_count\n\t\t),\n\t\t"pending_marker_detected_count": (\n\t\t\t_catalog_pending_marker_detected_count\n\t\t),\n\t\t"last_pending_marker_detected_count": (\n\t\t\t_last_catalog_pending_marker_detected_count\n\t\t),\n\t\t"last_world_count": _last_catalog_world_count,',
          )
          replace_once(
              save,
              '\t_catalog_write_failure_count = 0\n\t_last_catalog_world_count = 0',
              '\t_catalog_write_failure_count = 0\n\t_catalog_pending_marker_write_failure_count = 0\n\t_catalog_pending_marker_clear_failure_count = 0\n\t_catalog_pending_marker_detected_count = 0\n\t_last_catalog_pending_marker_detected_count = 0\n\t_last_catalog_world_count = 0',
          )
          replace_once(
              save,
              'func _read_catalog_entry(world_id: String) -> Dictionary:\n\tif not _is_safe_id(world_id):\n\t\treturn {}\n\tvar world_bytes := _file_size(_world_path(world_id))',
              'func _read_catalog_entry(world_id: String) -> Dictionary:\n\tif not _is_safe_id(world_id):\n\t\treturn {}\n\tif _catalog_pending_exists(world_id):\n\t\t_catalog_pending_marker_detected_count += 1\n\t\t_last_catalog_pending_marker_detected_count += 1\n\t\treturn {}\n\tvar world_bytes := _file_size(_world_path(world_id))',
          )
          replace_once(
              save,
              '\tvar written := _store.write_dictionary(_catalog_path(world_id), normalized)\n\tif written:\n\t\t_staged_catalog_entries.erase(world_id)\n\treturn written',
              '\tvar written := _store.write_dictionary(_catalog_path(world_id), normalized)\n\tif written:\n\t\t_staged_catalog_entries.erase(world_id)\n\t\tif not _clear_catalog_pending(world_id):\n\t\t\t_catalog_pending_marker_clear_failure_count += 1\n\treturn written',
          )
          replace_once(
              save,
              'func _catalog_path(world_id: String) -> String:\n\treturn "%s/%s" % [_world_directory(world_id), CATALOG_FILE_NAME]\n\n\nfunc _file_size(path: String) -> int:',
              '''func _catalog_path(world_id: String) -> String:
\treturn "%s/%s" % [_world_directory(world_id), CATALOG_FILE_NAME]


func _catalog_pending_path(world_id: String) -> String:
\treturn "%s/%s" % [_world_directory(world_id), CATALOG_PENDING_FILE_NAME]


func _catalog_pending_exists(world_id: String) -> bool:
\treturn _is_safe_id(world_id) and FileAccess.file_exists(
\t\t_catalog_pending_path(world_id)
\t)


func _mark_catalog_pending(world_id: String) -> bool:
\tif not _is_safe_id(world_id):
\t\treturn false
\t_ensure_directory(_world_directory(world_id))
\tvar path := _catalog_pending_path(world_id)
\tvar file := FileAccess.open(path, FileAccess.WRITE)
\tif file == null:
\t\treturn false
\tfile.store_string("pending=%d\\n" % Time.get_ticks_usec())
\tfile.flush()
\tvar write_error := file.get_error()
\tfile.close()
\treturn write_error == OK and FileAccess.file_exists(path)


func _clear_catalog_pending(world_id: String) -> bool:
\tif not _is_safe_id(world_id):
\t\treturn false
\tvar path := _catalog_pending_path(world_id)
\tif not FileAccess.file_exists(path):
\t\treturn true
\treturn DirAccess.remove_absolute(ProjectSettings.globalize_path(path)) == OK


func _file_size(path: String) -> int:''',
          )

          run_all = Path('tests/run_all.ps1')
          replace_once(
              run_all,
              '& "$PSScriptRoot\\developer_b\\validate_world_catalog.ps1"\n& "$PSScriptRoot\\developer_b\\validate_save_recovery.ps1"',
              '& "$PSScriptRoot\\developer_b\\validate_world_catalog.ps1"\n& "$PSScriptRoot\\developer_b\\validate_long_term_scale_recovery.ps1"\n& "$PSScriptRoot\\developer_b\\validate_save_recovery.ps1"',
          )
          replace_once(
              run_all,
              "Invoke-GodotTest 'res://tests/qa/world_catalog_regression.gd'\nInvoke-GodotTest 'res://tests/qa/save_recovery_regression.gd' -UserDataDir 'save-recovery'",
              "Invoke-GodotTest 'res://tests/qa/world_catalog_regression.gd'\nInvoke-GodotTest 'res://tests/qa/catalog_transaction_marker_recovery_regression.gd' -UserDataDir 'catalog-transaction-marker'\nInvoke-GodotTest 'res://tests/qa/long_term_scale_recovery_regression.gd'\nInvoke-GodotTest 'res://tests/qa/save_recovery_regression.gd' -UserDataDir 'save-recovery'",
          )
          replace_once(
              run_all,
              "Invoke-GodotTest 'res://tests/qa/structural_integrity_batched_regression.gd'\nInvoke-GodotTest 'res://tests/qa/world_mutation_batch_regression.gd'",
              "Invoke-GodotTest 'res://tests/qa/structural_integrity_batched_regression.gd'\nInvoke-GodotTest 'res://tests/qa/long_term_structure_pickup_churn_regression.gd'\nInvoke-GodotTest 'res://tests/qa/world_mutation_batch_regression.gd'",
          )

          roadmap = Path('docs/PRODUCT_ROADMAP.md')
          roadmap_text = roadmap.read_text(encoding='utf-8').rstrip('\n')
          if '## Iteration 58 · 长期规模与恢复资格（2026-08-06）' in roadmap_text:
              raise SystemExit('PRODUCT_ROADMAP already contains Iteration 58')
          roadmap.write_text(roadmap_text + '''

## Iteration 58 · 长期规模与恢复资格（2026-08-06）

- `catalog.pending` 为 world 与派生 sidecar 建立跨文件崩溃边界；
- 同字节长度 stale catalog 在进程重启后强制回读权威 world、预算内重建并恢复纯命中；
- 24 小时、288 个五分钟窗口、三次失败退避突发和 6 次手动保存形成确定性资格；
- 检查点历史持续保持 12 条，累计原因计数与五世界本次进入过滤保持精确；
- 24 轮结构批处理与 5 轮满 128 掉落生命周期逐轮清零；
- 连接形状、Chunk 热返回、多世界恢复和既有长稳进入同一永久门禁；
- 3440×1440、2× 逻辑缩放和真实 Joypad 焦点路线输出 PNG/JSON 证据；
- 商业发布继续 **HOLD**，等待独立 E4-H、真实目标硬件和 7,200 秒最终包 soak。

合同见：

- [LONG_TERM_SCALE_RECOVERY.md](LONG_TERM_SCALE_RECOVERY.md)
- [LONG_TERM_SCALE_RECOVERY_TESTING.md](LONG_TERM_SCALE_RECOVERY_TESTING.md)
- [PRODUCT_ROADMAP_ITERATION_58.md](PRODUCT_ROADMAP_ITERATION_58.md)
'''.lstrip('\n'), encoding='utf-8')

          issues = Path('qa/issues-found.md')
          issues_text = issues.read_text(encoding='utf-8').rstrip('\n')
          if '## Iteration 58 · 长期规模与恢复资格' in issues_text:
              raise SystemExit('issues-found already contains Iteration 58')
          issues.write_text(issues_text + '''

## Iteration 58 · 长期规模与恢复资格

- **已修复：同字节 stale catalog 崩溃窗口。** `world.json` 成功替换但 `catalog.json` 尚未写入时，旧 sidecar 仅凭相同字节数可能被误接受。现在保存前创建 `catalog.pending`，重启列表看到标记后拒绝旧 sidecar、按既有预算回读权威 world、重建并清除标记。
- **已补齐：跨领域长期资格。** 新永久门禁在同一固定提交上组合 24 小时自动保存/检查点、五世界本次进入、24 轮结构、5×128 掉落、多世界恢复、连接形状和 Chunk 热返回。
- **已补齐：超宽屏、高 DPI 与控制器焦点证据。** 3440×1440 物理窗口、1720×720 逻辑画布和真实 Joypad D-pad/A/B 输出 PNG 与 JSON。
- **仍为外部 HOLD：** 独立 E4-H、真实最低/推荐硬件和严格 7,200 秒最终包目标硬件 soak 未由仓库自动化替代。
'''.lstrip('\n'), encoding='utf-8')
          PY

          git diff --check
          pwsh -NoLogo -NoProfile -File tests/developer_b/validate_long_term_scale_recovery.ps1

      - name: Commit Iteration 58 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/save/save_service.gd tests/run_all.ps1 docs/PRODUCT_ROADMAP.md qa/issues-found.md
          git commit -m 'feat: add crash-safe catalog transaction recovery'
          git push origin HEAD:agent/iteration-58-long-term-scale-recovery
