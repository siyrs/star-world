name: One-shot responsive journal wiring

on:
  push:
    branches:
      - agent/professional-ui-refresh

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/professional-ui-refresh
          fetch-depth: 0

      - name: Wire responsive exploration journal
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ui/game_ui.gd")
          text = path.read_text(encoding="utf-8")
          old = 'const ExplorationJournalPanelScript = preload("res://src/ui/exploration_journal_panel.gd")'
          new = 'const ExplorationJournalPanelScript = preload("res://src/ui/responsive_exploration_journal_panel.gd")'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one journal preload, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

      - name: Commit production composition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/game_ui.gd
          git diff --cached --check
          git commit -m "fix(ui): wire responsive exploration journal"
          git push origin HEAD:agent/professional-ui-refresh
