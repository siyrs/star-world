name: Iteration 59 bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - agent/iteration-59-release-integrity
    paths:
      - '.github/workflows/iteration-59-bootstrap.yml'
      - 'tools/iteration_59_apply.py'
      - 'tools/iteration_59_payload/**'

permissions:
  contents: write

concurrency:
  group: iteration-59-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed Iteration 59 payload
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-59-release-integrity
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed payload
        shell: pwsh
        run: python tools/iteration_59_apply.py

      - name: Remove transport payload and validate final tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'tools/iteration_59_payload') {
            Remove-Item -LiteralPath 'tools/iteration_59_payload' -Recurse -Force
          }
          if (Test-Path -LiteralPath 'tools/iteration_59_apply.py') {
            throw 'Iteration 59 payload executor survived cleanup'
          }
          if (Test-Path -LiteralPath '.github/workflows/iteration-59-bootstrap.yml') {
            throw 'Iteration 59 bootstrap workflow survived cleanup'
          }
          .\tests\developer_b\validate_release_integrity_iteration_59.ps1
          git diff --check

      - name: Commit validated implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add release integrity and lifecycle qualification'
          git push origin HEAD:agent/iteration-59-release-integrity
