name: Bounded firearm combat quality gates

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: bounded-firearm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Atomic magazines, bounded hitscan, cadence, input parity and equipped firearm visuals
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_data.ps1
        tests/developer_b/validate_controller_gameplay.ps1
        tests/developer_b/validate_bounded_ranged_combat.ps1
        tests/developer_b/validate_bounded_firearms.ps1
      primary_headless_script: res://tests/qa/firearm_runtime_regression.gd
      primary_headless_output_base: build\firearm-runtime
      primary_headless_timeout_milliseconds: 900000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/firearm_registry_regression.gd
        res://tests/qa/ranged_combat_registry_regression.gd
        res://tests/qa/ranged_combat_runtime_regression.gd
        res://tests/qa/controller_gameplay_regression.gd
        res://tests/qa/first_person_viewmodel_regression.gd
        res://tests/qa/equipment_combat_regression.gd
        res://tests/qa/inventory_transaction_regression.gd
        res://tests/qa/runtime_soak_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: bounded-firearm-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/firearm-runtime.stdout.log
        build/firearm-runtime.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real mouse, keyboard and controller firearm journey with save reload
      desktop_timeout_minutes: 120
      desktop_script: res://tests/qa/firearm_desktop_acceptance.gd
      desktop_output_path: build\firearm-combat-reload.png
      desktop_timeout_milliseconds: 1200000
      desktop_artifact_name: bounded-firearm-evidence
      desktop_artifact_paths: |
        build/firearm-combat-reload.png
        build/firearm-combat-hit.png
        build/firearm-combat-report.json
        build/firearm-combat-reload.stdout.log
        build/firearm-combat-reload.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 14
