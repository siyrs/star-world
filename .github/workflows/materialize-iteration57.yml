name: Materialize Iteration 57

on:
  push:
    branches:
      - agent/post-release-feature-iteration
    paths:
      - '.github/workflows/materialize-iteration57.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-iteration-57
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify controlled patch
        shell: bash
        run: |
          set -euo pipefail
          cat .iteration57-payload/part-* > "$RUNNER_TEMP/iteration57.diff.xz.b64"
          base64 --decode "$RUNNER_TEMP/iteration57.diff.xz.b64" > "$RUNNER_TEMP/iteration57.diff.xz"
          echo '963ca9e23255ad21c75d09889d8ead93c12949d52f79b6bba463a5e32cf9c2b4  '"$RUNNER_TEMP/iteration57.diff.xz" | sha256sum --check --status
          xz --decompress --stdout "$RUNNER_TEMP/iteration57.diff.xz" > "$RUNNER_TEMP/iteration57.diff"
          test "$(wc -c < "$RUNNER_TEMP/iteration57.diff")" -eq 153225

      - name: Apply source implementation
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < "$RUNNER_TEMP/iteration57.diff"
          rm -rf .iteration57-payload
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PRODUCT_ROADMAP.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8')
          PY

          # Workflow mutations are performed separately through the authorized
          # GitHub connector because GITHUB_TOKEN cannot change workflow files.
          rm -f .github/workflows/combat-feedback-intensity-economy-tests.yml
          git checkout -- .github/workflows/temporary-next-iteration-snapshot.yml

          test -e src/combat/damage_direction_policy.gd
          test -e src/entity/encounter_intensity_registry.gd
          test -e tests/qa/mixed_combat_long_run_regression.gd
          git diff --check

      - name: Commit complete source iteration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete combat feedback intensity and economy iteration'
          git push origin HEAD:agent/post-release-feature-iteration
