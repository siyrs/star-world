name: Iteration 63 materializer

on:
  push:
    branches:
      - agent/iteration-63-publisher-signing-gate
    paths:
      - '.github/iteration-63-materialize.py'
      - '.github/workflows/iteration-63-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-63-publisher-signing-gate
          fetch-depth: 0

      - name: Apply integration patch
        shell: bash
        run: python .github/iteration-63-materialize.py

      - name: Commit integration and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/iteration-63-materialize.py .github/workflows/iteration-63-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRODUCT_ROADMAP.md tests/run_all.ps1 docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/09-feature-status-board.md docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/11-readiness-gates.md .github/iteration-63-materialize.py .github/workflows/iteration-63-materialize.yml
          git commit -m "docs: reconcile roadmap through iteration 63"
          git push origin HEAD:agent/iteration-63-publisher-signing-gate
