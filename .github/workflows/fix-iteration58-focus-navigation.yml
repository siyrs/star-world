name: Fix Iteration 58 controller focus navigation

on:
  push:
    branches:
      - agent/iteration-58-long-term-scale-recovery
    paths:
      - '.github/workflows/fix-iteration58-focus-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-iteration-58-focus-navigation
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add bounded real-controller focus traversal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          menu = Path('src/ui/protected_main_menu.gd')
          replace_once(
              menu,
              '\tset_process_unhandled_input(true)\n\tcall_deferred("_focus_primary_action")',
              '\tset_process_input(true)\n\tset_process_unhandled_input(true)\n\tcall_deferred("_focus_primary_action")',
          )
          navigation = '''func _input(event: InputEvent) -> void:
\tif not visible or _loading or event is not InputEventJoypadButton:
\t\treturn
\tvar button_event := event as InputEventJoypadButton
\tif not button_event.pressed:
\t\treturn
\tvar direction := 0
\tif button_event.button_index == JOY_BUTTON_DPAD_DOWN:
\t\tdirection = 1
\telif button_event.button_index == JOY_BUTTON_DPAD_UP:
\t\tdirection = -1
\tif direction == 0:
\t\treturn
\tif _move_controller_focus(direction):
\t\tget_viewport().set_input_as_handled()


func _move_controller_focus(direction: int) -> bool:
\tvar scope := _controller_focus_scope()
\tif scope == null:
\t\treturn false
\tvar focusables: Array[Control] = []
\t_collect_controller_focusables(scope, focusables)
\tif focusables.size() < 2:
\t\treturn false
\tvar current := get_viewport().gui_get_focus_owner()
\tvar current_index := focusables.find(current)
\tvar target_index := 0
\tif current_index >= 0:
\t\ttarget_index = posmod(current_index + direction, focusables.size())
\tvar target := focusables[target_index]
\tif target == current:
\t\treturn false
\ttarget.grab_focus()
\t_ensure_controller_focus_visible(target)
\treturn get_viewport().gui_get_focus_owner() == target


func _controller_focus_scope() -> Control:
\tfor panel: Control in [_map_panel, _save_panel, _settings_panel, _update_panel]:
\t\tif panel != null and is_instance_valid(panel) and panel.is_visible_in_tree():
\t\t\treturn panel
\tif _main_panel != null and _main_panel.is_visible_in_tree():
\t\treturn _main_panel
\treturn null


func _collect_controller_focusables(node: Node, result: Array[Control]) -> void:
\tif node == null:
\t\treturn
\tif node is Control:
\t\tvar control := node as Control
\t\tvar disabled := false
\t\tif control is BaseButton:
\t\t\tdisabled = (control as BaseButton).disabled
\t\tif control.is_visible_in_tree() and control.focus_mode != Control.FOCUS_NONE and not disabled:
\t\t\tresult.append(control)
\tfor child: Node in node.get_children():
\t\t_collect_controller_focusables(child, result)


func _ensure_controller_focus_visible(control: Control) -> void:
\tvar ancestor := control.get_parent()
\twhile ancestor != null:
\t\tif ancestor is ScrollContainer:
\t\t\t(ancestor as ScrollContainer).ensure_control_visible(control)
\t\tancestor = ancestor.get_parent()


'''
          replace_once(
              menu,
              'func _unhandled_input(event: InputEvent) -> void:\n',
              navigation + 'func _unhandled_input(event: InputEvent) -> void:\n',
          )

          validator = Path('tests/developer_b/validate_long_term_scale_recovery.ps1')
          replace_once(
              validator,
              "  desktop = Join-Path $root 'tests\\qa\\ultrawide_high_dpi_controller_focus_desktop_acceptance.gd'\n  workflow = Join-Path $root '.github\\workflows\\long-term-scale-recovery-tests.yml'",
              "  desktop = Join-Path $root 'tests\\qa\\ultrawide_high_dpi_controller_focus_desktop_acceptance.gd'\n  navigation = Join-Path $root 'src\\ui\\protected_main_menu.gd'\n  workflow = Join-Path $root '.github\\workflows\\long-term-scale-recovery-tests.yml'",
          )
          insert = '''
foreach ($token in @(
  'set_process_input\\(true\\)',
  'JOY_BUTTON_DPAD_DOWN',
  'JOY_BUTTON_DPAD_UP',
  'func\\s+_move_controller_focus\\s*\\(',
  'func\\s+_controller_focus_scope\\s*\\(',
  'func\\s+_collect_controller_focusables\\s*\\(',
  'ensure_control_visible',
  'set_input_as_handled'
)) {
  Assert-Match $text.navigation $token "Production controller focus graph is missing: $token"
}
Assert-NoMatch $text.navigation 'Timer\\.new|Thread\\.new|get_nodes_in_group' 'Controller focus navigation must remain event-driven and tree-local'

'''
          replace_once(
              validator,
              "foreach ($token in @(\n  'uses:\\s*\\./\\.github/workflows/reusable-godot-quality-gate\\.yml',",
              insert + "foreach ($token in @(\n  'uses:\\s*\\./\\.github/workflows/reusable-godot-quality-gate\\.yml',",
          )

          desktop = Path('tests/qa/ultrawide_high_dpi_controller_focus_desktop_acceptance.gd')
          replace_once(
              desktop,
              '\t\tvar settings_focus := root.gui_get_focus_owner() as Control\n\t\t_check(settings_focus != null and settings_focus.visible, "settings workspace establishes a visible controller focus target")',
              '\t\tvar settings_focus := root.gui_get_focus_owner() as Control\n\t\t_check(settings_focus != null and settings_focus.visible, "settings workspace establishes a visible controller focus target")\n\t\tif settings_focus != null:\n\t\t\t_focus_route.append("settings-initial:%s" % _focus_label(settings_focus))',
          )
          replace_once(
              desktop,
              '\t\tif next_settings_focus != null:\n\t\t\t_focus_route.append(_focus_label(next_settings_focus))',
              '\t\tif next_settings_focus != null:\n\t\t\t_focus_route.append("settings-next:%s" % _focus_label(next_settings_focus))',
          )
          PY
          git diff --check
          pwsh -NoLogo -NoProfile -File tests/developer_b/validate_long_term_scale_recovery.ps1

      - name: Commit production focus navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/protected_main_menu.gd tests/developer_b/validate_long_term_scale_recovery.ps1 tests/qa/ultrawide_high_dpi_controller_focus_desktop_acceptance.gd
          git commit -m 'fix: add bounded real-controller focus traversal'
          git push origin HEAD:agent/iteration-58-long-term-scale-recovery
