name: Iteration 62 materializer

on:
  push:
    branches:
      - agent/iteration-62-offline-release-promotion
    paths:
      - '.github/workflows/iteration-62-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-62-offline-release-promotion
          fetch-depth: 0

      - name: Apply integration patch
        run: python .github/tmp/iteration-62-materialize.py

      - name: Commit integration and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/iteration-62-materialize.yml .github/tmp/iteration-62-materialize.py
          git add docs/PRODUCT_ROADMAP.md tests/run_all.ps1 docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/11-readiness-gates.md
          git commit -m "docs: reconcile roadmap through iteration 62"
          git push origin HEAD:agent/iteration-62-offline-release-promotion
