name: Bounded hostile ranged encounter quality gates

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: bounded-hostile-ranged-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Atomic hostile profiles, source-scoped damage, shared projectiles, LOS and cover tactics
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_data.ps1
        tests/developer_b/validate_ecology_danger.ps1
        tests/developer_b/validate_hostile_attacks.ps1
        tests/developer_b/validate_bounded_hostile_ranged.ps1
        tests/developer_b/validate_bounded_ranged_combat.ps1
        tests/developer_b/validate_bounded_firearms.ps1
      primary_headless_script: res://tests/qa/hostile_ranged_encounter_regression.gd
      primary_headless_output_base: build\hostile-ranged-runtime
      primary_headless_timeout_milliseconds: 900000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/hostile_attack_windup_regression.gd
        res://tests/qa/ecology_danger_regression.gd
        res://tests/qa/abyss_elite_regression.gd
        res://tests/qa/multi_hostile_danger_batch_regression.gd
        res://tests/qa/multi_hostile_arena_batch_regression.gd
        res://tests/qa/ranged_combat_runtime_regression.gd
        res://tests/qa/firearm_runtime_regression.gd
        res://tests/qa/runtime_soak_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: bounded-hostile-ranged-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/hostile-ranged-runtime.stdout.log
        build/hostile-ranged-runtime.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real marksman telegraph, projectile, cover, firearm defeat and save reload
      desktop_timeout_minutes: 120
      desktop_script: res://tests/qa/hostile_ranged_encounter_desktop_acceptance.gd
      desktop_output_path: build\hostile-ranged-aim.png
      desktop_timeout_milliseconds: 900000
      desktop_artifact_name: bounded-hostile-ranged-evidence
      desktop_artifact_paths: |
        build/hostile-ranged-aim.png
        build/hostile-ranged-cover.png
        build/hostile-ranged-report.json
        build/hostile-ranged-aim.stdout.log
        build/hostile-ranged-aim.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 14
