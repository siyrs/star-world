name: Player furnace closed-loop quality gates

on:
  pull_request:
    paths:
      - '.github/workflows/player-furnace-closed-loop-tests.yml'
      - '.github/workflows/reusable-godot-quality-gate.yml'
      - 'qa/content-journey-matrix.md'
      - 'qa/map-coverage-matrix.md'
      - 'qa/final-release-report.md'
      - 'qa/issues-found.md'
      - 'data/items.json'
      - 'data/furnace_recipes.json'
      - 'data/fuels.json'
      - 'scenes/game/**'
      - 'scenes/ui/**'
      - 'src/input/**'
      - 'src/interaction/**'
      - 'src/inventory/**'
      - 'src/machine/**'
      - 'src/save/**'
      - 'src/ui/**'
      - 'src/world/**'
      - 'tests/ci/run_godot_desktop_test.ps1'
      - 'tests/developer_b/validate_furnace_closed_loop.ps1'
      - 'tests/qa/furnace_machine_regression.gd'
      - 'tests/qa/furnace_desktop_acceptance.gd'
      - 'tests/qa/stonecutter_machine_regression.gd'
      - 'tests/qa/stonecutter_machine_desktop_acceptance.gd'
      - 'tests/qa/machine_base_regression.gd'
      - 'tests/qa/machine_automation_regression.gd'
      - 'tests/qa/machine_scale_runtime_regression.gd'
      - 'tests/qa/inventory_canonical_roundtrip_regression.gd'
      - 'tests/qa/inventory_transaction_regression.gd'
      - 'tests/qa/input_interaction_regression.gd'
      - 'tests/qa/block_interaction_regression.gd'
      - 'tests/qa/profile_release_journey_regression.gd'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/player-furnace-closed-loop-tests.yml'
      - 'qa/content-journey-matrix.md'
      - 'qa/map-coverage-matrix.md'
      - 'qa/final-release-report.md'
      - 'qa/issues-found.md'
      - 'data/furnace_recipes.json'
      - 'data/fuels.json'
      - 'src/interaction/**'
      - 'src/inventory/**'
      - 'src/machine/**'
      - 'src/save/**'
      - 'src/ui/furnace_panel.gd'
      - 'src/ui/game_ui.gd'
      - 'src/world/**'
      - 'tests/developer_b/validate_furnace_closed_loop.ps1'
      - 'tests/qa/furnace_machine_regression.gd'
      - 'tests/qa/furnace_desktop_acceptance.gd'
      - 'tests/qa/stonecutter_machine_desktop_acceptance.gd'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-furnace-closed-loop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Real furnace input failure output conservation and exact reload
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_furnace_closed_loop.ps1
        tests/developer_b/validate_machine_base.ps1
        tests/developer_b/validate_machine_scale.ps1
        tests/developer_b/validate_data.ps1
        tests/developer_b/validate_controller_gameplay.ps1
        tests/developer_b/validate_ui_accessibility.ps1
        tests/developer_b/validate_reusable_ci_workflows.ps1
      primary_headless_script: res://tests/qa/furnace_machine_regression.gd
      primary_headless_output_base: build\furnace-machine-domain
      primary_headless_timeout_milliseconds: 1200000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/inventory_canonical_roundtrip_regression.gd
        res://tests/qa/inventory_transaction_regression.gd
        res://tests/qa/machine_base_regression.gd
        res://tests/qa/machine_automation_regression.gd
        res://tests/qa/machine_scale_runtime_regression.gd
        res://tests/qa/stonecutter_machine_regression.gd
        res://tests/qa/input_interaction_regression.gd
        res://tests/qa/block_interaction_regression.gd
        res://tests/qa/profile_release_journey_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: player-furnace-closed-loop-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/furnace-machine-domain.stdout.log
        build/furnace-machine-domain.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real furnace failure save and reload journey
      desktop_timeout_minutes: 90
      desktop_script: res://tests/qa/furnace_desktop_acceptance.gd
      desktop_output_path: build\furnace-desktop-acceptance.png
      desktop_timeout_milliseconds: 1800000
      desktop_artifact_name: player-furnace-closed-loop-evidence
      desktop_artifact_paths: |
        build/furnace-desktop-acceptance.png
        build/furnace-desktop-acceptance.stdout.log
        build/furnace-desktop-acceptance.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 21

  adjacent-stonecutter-desktop:
    name: Re-review adjacent stonecutter production journey
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Stonecutter machine desktop journey
        shell: pwsh
        run: |
          $godotPath = (Get-Command godot).Source
          .\tests\ci\run_godot_desktop_test.ps1 `
            -Godot $godotPath `
            -ProjectRoot . `
            -ScriptPath 'res://tests/qa/stonecutter_machine_desktop_acceptance.gd' `
            -OutputPath 'build\stonecutter-machine-furnace-adjacent.png' `
            -TimeoutMilliseconds 1800000

      - name: Upload adjacent machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: furnace-adjacent-stonecutter-${{ github.run_number }}
          path: |
            build/stonecutter-machine-furnace-adjacent.*
          if-no-files-found: error
          retention-days: 21
