name: Bounded hostile cover counter quality gates

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: bounded-hostile-cover-counter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Temporary-cover destruction, permanent-base protection, bounded marksman reposition and lifecycle safety
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_data.ps1
        tests/developer_b/validate_world_mutation_batch.ps1
        tests/developer_b/validate_structural_integrity.ps1
        tests/developer_b/validate_bounded_hostile_ranged.ps1
        tests/developer_b/validate_bounded_hostile_encounters.ps1
        tests/developer_b/validate_bounded_hostile_cover_counter.ps1
      primary_headless_script: res://tests/qa/hostile_cover_counter_regression.gd
      primary_headless_output_base: build\hostile-cover-counter
      primary_headless_timeout_milliseconds: 900000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/hostile_ranged_encounter_regression.gd
        res://tests/qa/hostile_attack_windup_regression.gd
        res://tests/qa/hostile_encounter_director_regression.gd
        res://tests/qa/structural_integrity_batched_regression.gd
        res://tests/qa/world_mutation_batch_regression.gd
        res://tests/qa/connected_block_shapes_regression.gd
        res://tests/qa/double_door_regression.gd
        res://tests/qa/firearm_runtime_regression.gd
        res://tests/qa/runtime_soak_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: bounded-hostile-cover-counter-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/hostile-cover-counter.stdout.log
        build/hostile-cover-counter.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real brute breach, permanent-wall block, marksman reposition, projectile recovery and save reload
      desktop_timeout_minutes: 120
      desktop_script: res://tests/qa/hostile_cover_counter_desktop_acceptance.gd
      desktop_output_path: build\hostile-cover-broken.png
      desktop_timeout_milliseconds: 1200000
      desktop_artifact_name: bounded-hostile-cover-counter-evidence
      desktop_artifact_paths: |
        build/hostile-cover-broken.png
        build/hostile-cover-reposition.png
        build/hostile-cover-report.json
        build/hostile-cover-broken.stdout.log
        build/hostile-cover-broken.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 14
