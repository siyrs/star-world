name: Iteration 61 roadmap materializer

on:
  push:
    branches:
      - agent/iteration-61-release-candidate-chain
    paths:
      - '.github/workflows/iteration-61-roadmap-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-61-release-candidate-chain
          fetch-depth: 0

      - name: Patch roadmap and full runner
        shell: bash
        env:
          ROADMAP_APPEND_B64: 
          READINESS_APPEND_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          roadmap = Path('docs/PRODUCT_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          if '## Iteration 60 · 可审计外部资格证据' not in text:
              text += base64.b64decode(os.environ['ROADMAP_APPEND_B64']).decode('utf-8')
              roadmap.write_text(text, encoding='utf-8')

          runner = Path('tests/run_all.ps1')
          text = runner.read_text(encoding='utf-8')
          anchor = '& "$PSScriptRoot\\developer_b\\validate_release_integrity_iteration_59.ps1"'
          additions = [
              '& "$PSScriptRoot\\developer_b\\validate_external_qualification_iteration_60.ps1"',
              '& "$PSScriptRoot\\developer_b\\validate_release_candidate_chain_iteration_61.ps1"',
          ]
          if anchor not in text:
              raise SystemExit('run_all insertion anchor is missing')
          missing = [line for line in additions if line not in text]
          if missing:
              runner.write_text(text.replace(anchor, anchor + '\n' + '\n'.join(missing), 1), encoding='utf-8')

          readiness = Path('docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/11-readiness-gates.md')
          text = readiness.read_text(encoding='utf-8')
          if '## Post-implementation reconciliation · Iterations 60-61' not in text:
              text += base64.b64decode(os.environ['READINESS_APPEND_B64']).decode('utf-8')
              readiness.write_text(text, encoding='utf-8')

          Path('.github/workflows/iteration-61-roadmap-materialize.yml').unlink()
          PY

      - name: Commit materialized integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRODUCT_ROADMAP.md tests/run_all.ps1 docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/11-readiness-gates.md .github/workflows/iteration-61-roadmap-materialize.yml
          git commit -m "docs: reconcile roadmap through iteration 61"
          git push origin HEAD:agent/iteration-61-release-candidate-chain
