name: Temporary generator cache branch patch

on:
  push:
    branches:
      - agent/bounded-generator-column-cache

permissions:
  contents: write

concurrency:
  group: temporary-generator-cache-branch-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-generator-column-cache
          fetch-depth: 0

      - name: Apply reviewed generator, diagnostics, metric and documentation changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8", newline="\n")

          def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one exact match, found {count}")
              return content.replace(old, new, 1)

          def regex_once(content: str, pattern: str, replacement: str, label: str) -> str:
              result, count = re.subn(pattern, replacement, content, count=1, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one regex match, found {count}")
              return result

          generator_path = "src/world/world_generator.gd"
          generator = read(generator_path)
          generator = replace_once(
              generator,
              'const SpawnQualityRegistryScript = preload("res://src/world/spawn_quality_registry.gd")\n',
              'const SpawnQualityRegistryScript = preload("res://src/world/spawn_quality_registry.gd")\nconst ColumnCacheScript = preload("res://src/world/world_generator_column_cache.gd")\n',
              "generator cache preload",
          )
          generator = replace_once(
              generator,
              'const WORLD_HEIGHT := 64\n',
              'const WORLD_HEIGHT := 64\nconst MAX_COLUMN_CACHE_ENTRIES := 8192\n',
              "generator cache capacity",
          )
          generator = replace_once(
              generator,
              'var _last_spawn_quality_snapshot: Dictionary = {}\n',
              'var _last_spawn_quality_snapshot: Dictionary = {}\nvar _column_cache = ColumnCacheScript.new(MAX_COLUMN_CACHE_ENTRIES)\nvar _surface_height_evaluation_count := 0\nvar _sky_strength_evaluation_count := 0\n',
              "generator cache fields",
          )
          generator = replace_once(
              generator,
              '\tprofile_id = normalize_profile_id(p_profile_id)\n',
              '\tprofile_id = normalize_profile_id(p_profile_id)\n\t_column_cache.clear(true)\n\t_surface_height_evaluation_count = 0\n\t_sky_strength_evaluation_count = 0\n',
              "generator configure invalidation",
          )

          surface_match = re.search(
              r'func get_surface_height\(x: int, z: int\) -> int:\n.*?(?=\n\nfunc find_spawn_position\(\))',
              generator,
              flags=re.DOTALL,
          )
          if surface_match is None:
              raise RuntimeError("surface-height function was not found")
          uncached_surface = surface_match.group(0).replace(
              'func get_surface_height(x: int, z: int) -> int:',
              'func _compute_surface_height_uncached(x: int, z: int) -> int:',
              1,
          )
          cached_surface = '''func get_surface_height(x: int, z: int) -> int:
          \tvar column := Vector2i(x, z)
          \tvar cached_height: Variant = _column_cache.get_height(column)
          \tif cached_height != null:
          \t\treturn int(cached_height)
          \t_surface_height_evaluation_count += 1
          \tvar height := _compute_surface_height_uncached(x, z)
          \t_column_cache.store_height(column, height)
          \treturn height
          
          
          ''' + uncached_surface + '''
          
          
          func get_column_cache_stats() -> Dictionary:
          \tvar stats: Dictionary = _column_cache.get_stats()
          \tstats["profile_id"] = profile_id
          \tstats["seed"] = seed_value
          \tstats["surface_height_evaluation_count"] = _surface_height_evaluation_count
          \tstats["sky_strength_evaluation_count"] = _sky_strength_evaluation_count
          \tstats["maximum_column_cache_entries"] = MAX_COLUMN_CACHE_ENTRIES
          \treturn stats
          
          
          func set_column_cache_enabled_for_test(value: bool) -> void:
          \t_column_cache.set_enabled(value)
          \t_column_cache.clear(true)
          \t_surface_height_evaluation_count = 0
          \t_sky_strength_evaluation_count = 0
          '''
          generator = generator[:surface_match.start()] + cached_surface + generator[surface_match.end():]

          sky_match = re.search(
              r'func _sky_island_strength\(x: int, z: int\) -> float:\n.*?(?=\n\nfunc )',
              generator,
              flags=re.DOTALL,
          )
          if sky_match is None:
              raise RuntimeError("sky-island strength function was not found")
          uncached_sky = sky_match.group(0).replace(
              'func _sky_island_strength(x: int, z: int) -> float:',
              'func _compute_sky_island_strength_uncached(x: int, z: int) -> float:',
              1,
          )
          cached_sky = '''func _sky_island_strength(x: int, z: int) -> float:
          \tvar column := Vector2i(x, z)
          \tvar cached_strength: Variant = _column_cache.get_sky_strength(column)
          \tif cached_strength != null:
          \t\treturn float(cached_strength)
          \t_sky_strength_evaluation_count += 1
          \tvar strength := _compute_sky_island_strength_uncached(x, z)
          \t_column_cache.store_sky_strength(column, strength)
          \treturn strength
          
          
          ''' + uncached_sky
          generator = generator[:sky_match.start()] + cached_sky + generator[sky_match.end():]
          write(generator_path, generator)

          world_path = "src/world/voxel_world.gd"
          world = read(world_path)
          world = regex_once(
              world,
              r'func get_streaming_stats\(\) -> Dictionary:\n.*?(?=\n\nfunc force_load_chunk)',
              '''func get_streaming_stats() -> Dictionary:
          \tvar result := {
          \t\t"loaded": chunks.size(),
          \t\t"building": _building_chunks.size(),
          \t\t"pending": _streaming_scheduler.pending_count(),
          \t\t"last_work_usec": _last_streaming_work_usec,
          \t\t"focus_chunk": _focus_chunk,
          \t}
          \tif generator != null and generator.has_method("get_column_cache_stats"):
          \t\tresult["generator_column_cache"] = generator.call("get_column_cache_stats")
          \treturn result''',
              "world streaming diagnostics",
          )
          write(world_path, world)

          capture_path = "tests/qa/performance_scenario_capture.gd"
          capture = read(capture_path)
          capture = replace_once(
              capture,
              'const MapProfileCatalogScript = preload("res://src/world/map_profile_catalog.gd")\n',
              'const MapProfileCatalogScript = preload("res://src/world/map_profile_catalog.gd")\nconst FramePerformanceMetricsScript = preload("res://src/core/frame_performance_metrics.gd")\n',
              "frame metric preload",
          )
          capture = replace_once(
              capture,
              '''\tvar summary: Dictionary = {
          \t\t"profile": profile_id,
          \t\t"phase": phase,
          \t\t"sample_count": frame_ms.size(),
          \t\t"load_ms": load_ms,
          \t\t"avg_fps": _average(fps),
          \t\t"one_percent_low_fps": _percentile(fps, 1.0),
          \t\t"frame_ms_avg": _average(frame_ms),
          \t\t"frame_ms_p95": _percentile(frame_ms, 95.0),
          \t\t"frame_ms_p99": _percentile(frame_ms, 99.0),
          \t\t"node_count": int(Performance.get_monitor(Performance.OBJECT_NODE_COUNT)),
          \t\t"draw_calls": int(Performance.get_monitor(Performance.RENDER_TOTAL_DRAW_CALLS_IN_FRAME)),
          \t}
          ''',
              '''\tvar summary: Dictionary = FramePerformanceMetricsScript.summarize(frame_ms, fps)
          \tsummary.merge({
          \t\t"metric_schema": "frame-time-tail-v2",
          \t\t"profile": profile_id,
          \t\t"phase": phase,
          \t\t"load_ms": load_ms,
          \t\t"node_count": int(Performance.get_monitor(Performance.OBJECT_NODE_COUNT)),
          \t\t"draw_calls": int(Performance.get_monitor(Performance.RENDER_TOTAL_DRAW_CALLS_IN_FRAME)),
          \t}, true)
          ''',
              "performance summary",
          )
          capture = replace_once(
              capture,
              '''\tprint(
          \t\t"PERF_SCENARIO profile=%s phase=%s samples=%d avg_fps=%.1f 1%%low=%.1f frame_avg=%.2f p95=%.2f p99=%.2f load=%dms"
          \t\t% [
          \t\t\tprofile_id, phase, summary["sample_count"],
          \t\t\tsummary["avg_fps"], summary["one_percent_low_fps"],
          \t\t\tsummary["frame_ms_avg"], summary["frame_ms_p95"], summary["frame_ms_p99"], load_ms,
          \t\t]
          \t)
          ''',
              '''\tprint(
          \t\t"PERF_SCENARIO profile=%s phase=%s samples=%d avg_fps=%.1f 1%%low=%.1f frame_avg=%.2f p95=%.2f p99=%.2f miss60=%.1f%% engine_diag=%.1f load=%dms"
          \t\t% [
          \t\t\tprofile_id, phase, summary["sample_count"],
          \t\t\tsummary["avg_fps"], summary["one_percent_low_fps"],
          \t\t\tsummary["frame_ms_avg"], summary["frame_ms_p95"], summary["frame_ms_p99"],
          \t\t\tsummary["frame_budget_miss_60fps_percent"],
          \t\t\tsummary["engine_fps_avg_diagnostic"], load_ms,
          \t\t]
          \t)
          ''',
              "performance log",
          )
          capture = replace_once(
              capture,
              '"schema_version": 1,',
              '"schema_version": 2,',
              "performance schema",
          )
          capture = regex_once(
              capture,
              r'\n\nfunc _average\(values: Array\) -> float:\n.*?(?=\n\nfunc _track\()',
              '',
              "obsolete local metrics",
          )
          capture = replace_once(
              capture,
              'Scenarios: main menu, each profile spawn + rapid movement/turning pressure,\n# repeated load, and a settings change. Each scenario records real frame times\n# (avg / p95 / p99 / 1% low FPS), fps, streaming convergence, node count, and a\n',
              'Scenarios: main menu, each profile spawn + rapid movement/turning pressure,\n# repeated load, and a settings change. Average FPS, 1% Low and frame-budget\n# misses derive from the same real frame-time samples; rolling engine FPS is\n# retained only as a diagnostic alongside streaming convergence and node count. A\n',
              "performance documentation",
          )
          write(capture_path, capture)

          performance_path = "qa/performance-baseline.md"
          performance = read(performance_path)
          audit = '''# 性能基线与优化对比
          
          ## 2026-08-02 复审纠偏
          
          - **BUG-PERF-METRIC-001（P1）**：旧版 `1% Low FPS` 已废弃。原脚本对 `Engine.get_frames_per_second()` 的滚动统计取 1 分位，这不是由真实逐帧耗时计算的 1% Low，并造成主菜单单帧动画被记录为 1 FPS 等失真。新 schema v2 使用真实帧时间：平均 FPS=`1000/平均帧时`，1% Low=`1000/最慢 1% 帧的平均帧时`，同时记录 60/30 FPS 帧预算超限比例；滚动 FPS 仅保留为 diagnostic。
          - **BUG-PERF-COLUMN-001（P1）**：生成器此前对同一 `(x,z)` 柱的每个 Y 单元重复计算地表噪声；天空群岛还会重复执行 3×3 岛心搜索。现由容量 8192、最大容量 32768 的有界 FIFO 柱缓存保存不可变地表高度与岛屿强度，Profile/Seed 重配时强制失效，并向运行时 streaming diagnostics 暴露命中、未命中、淘汰与真实评估次数。
          - 下表的逐帧 `frame_ms`、p95、p99、加载时间与内存原始样本仍有历史参考价值；其中旧版 `平均 FPS` 与 `1% Low FPS` 两列不再作为发布判定依据，必须使用 schema v2 在目标最低/推荐硬件上重新采集。
          - 本轮优化的自动化验收不以易受共享 Runner 波动影响的绝对耗时作为唯一门槛，而是同时证明：缓存开关前后所有方块完全一致、缓存和 FIFO 账本均有硬上限、天空群岛整 Chunk 的地表与岛屿强度真实评估次数至少下降 32 倍，并输出同进程耗时对比供审计。
          
          '''
          if not performance.startswith('# 性能基线与优化对比\n'):
              raise RuntimeError('performance baseline heading changed unexpectedly')
          performance = audit + performance[len('# 性能基线与优化对比\n\n'):]
          write(performance_path, performance)

      - name: Commit branch corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "star-world-quality-bot"
          git config user.email "star-world-quality-bot@users.noreply.github.com"
          git add src/world/world_generator.gd \
                  src/world/voxel_world.gd \
                  tests/qa/performance_scenario_capture.gd \
                  qa/performance-baseline.md
          git diff --cached --check
          git commit -m "perf: cache immutable generator columns and correct frame metrics"
          git push origin HEAD:agent/bounded-generator-column-cache
