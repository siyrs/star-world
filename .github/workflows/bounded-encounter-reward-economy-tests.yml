name: Bounded encounter reward economy quality gates

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: bounded-encounter-reward-economy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Atomic rewards, exact ammo attribution, defeat-only claims, pending retry and long-session economy
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_data.ps1
        tests/developer_b/validate_ecology_danger.ps1
        tests/developer_b/validate_bounded_hostile_encounters.ps1
        tests/developer_b/validate_bounded_encounter_rewards.ps1
        tests/developer_b/validate_bounded_hostile_ranged.ps1
        tests/developer_b/validate_bounded_firearms.ps1
      primary_headless_script: res://tests/qa/encounter_reward_economy_regression.gd
      primary_headless_output_base: build\encounter-reward-economy
      primary_headless_timeout_milliseconds: 900000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/hostile_encounter_director_regression.gd
        res://tests/qa/hostile_ranged_encounter_regression.gd
        res://tests/qa/hostile_attack_windup_regression.gd
        res://tests/qa/firearm_runtime_regression.gd
        res://tests/qa/ranged_combat_runtime_regression.gd
        res://tests/qa/inventory_transaction_regression.gd
        res://tests/qa/multi_hostile_danger_batch_regression.gd
        res://tests/qa/runtime_soak_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: bounded-encounter-reward-economy-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/encounter-reward-economy.stdout.log
        build/encounter-reward-economy.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real reward grant full-inventory pending retry abandonment and save reload
      desktop_timeout_minutes: 120
      desktop_script: res://tests/qa/encounter_reward_economy_desktop_acceptance.gd
      desktop_output_path: build\encounter-reward-granted.png
      desktop_timeout_milliseconds: 1200000
      desktop_artifact_name: bounded-encounter-reward-economy-evidence
      desktop_artifact_paths: |
        build/encounter-reward-granted.png
        build/encounter-reward-pending.png
        build/encounter-reward-report.json
        build/encounter-reward-granted.stdout.log
        build/encounter-reward-granted.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 14
