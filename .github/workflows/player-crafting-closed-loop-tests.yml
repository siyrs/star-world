name: Player crafting closed-loop quality gates

on:
  pull_request:
    paths:
      - '.github/workflows/player-crafting-closed-loop-tests.yml'
      - '.github/workflows/reusable-godot-quality-gate.yml'
      - 'qa/content-journey-matrix.md'
      - 'qa/map-coverage-matrix.md'
      - 'qa/final-release-report.md'
      - 'qa/issues-found.md'
      - 'data/items.json'
      - 'data/recipes.json'
      - 'scenes/game/**'
      - 'scenes/ui/**'
      - 'src/core/**'
      - 'src/crafting/**'
      - 'src/input/**'
      - 'src/interaction/**'
      - 'src/inventory/**'
      - 'src/save/**'
      - 'src/ui/**'
      - 'src/world/**'
      - 'tests/ci/run_godot_desktop_test.ps1'
      - 'tests/developer_b/validate_crafting_closed_loop.ps1'
      - 'tests/qa/crafting_desktop_acceptance.gd'
      - 'tests/qa/stonecutter_machine_desktop_acceptance.gd'
      - 'tests/qa/husbandry_desktop_acceptance.gd'
      - 'tests/qa/ranch_products_desktop_acceptance.gd'
      - 'tests/qa/repair_desktop_acceptance.gd'
      - 'tests/qa/integration_regression.gd'
      - 'tests/qa/input_interaction_regression.gd'
      - 'tests/qa/inventory_transaction_regression.gd'
      - 'tests/qa/block_interaction_regression.gd'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/player-crafting-closed-loop-tests.yml'
      - 'qa/content-journey-matrix.md'
      - 'qa/map-coverage-matrix.md'
      - 'qa/final-release-report.md'
      - 'qa/issues-found.md'
      - 'data/items.json'
      - 'data/recipes.json'
      - 'src/crafting/**'
      - 'src/input/**'
      - 'src/interaction/**'
      - 'src/inventory/**'
      - 'src/save/**'
      - 'src/ui/crafting_panel.gd'
      - 'src/ui/game_ui.gd'
      - 'tests/developer_b/validate_crafting_closed_loop.ps1'
      - 'tests/qa/crafting_desktop_acceptance.gd'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-crafting-closed-loop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Real hand and workbench crafting with atomic failure and exact save reload
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_crafting_closed_loop.ps1
        tests/developer_b/validate_data.ps1
        tests/developer_b/validate_controller_gameplay.ps1
        tests/developer_b/validate_ui_accessibility.ps1
        tests/developer_b/validate_reusable_ci_workflows.ps1
      primary_headless_script: res://tests/developer_b/run_tests.gd
      primary_headless_output_base: build\crafting-service-domain
      primary_headless_timeout_milliseconds: 1200000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/inventory_transaction_regression.gd
        res://tests/qa/integration_regression.gd
        res://tests/qa/input_interaction_regression.gd
        res://tests/qa/block_interaction_regression.gd
        res://tests/qa/profile_release_journey_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: player-crafting-closed-loop-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/crafting-service-domain.stdout.log
        build/crafting-service-domain.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real hand and workbench crafting desktop journey
      desktop_timeout_minutes: 90
      desktop_script: res://tests/qa/crafting_desktop_acceptance.gd
      desktop_output_path: build\crafting-desktop-acceptance.png
      desktop_timeout_milliseconds: 1800000
      desktop_artifact_name: player-crafting-closed-loop-evidence
      desktop_artifact_paths: |
        build/crafting-desktop-acceptance.png
        build/crafting-desktop-acceptance.stdout.log
        build/crafting-desktop-acceptance.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 21

  adjacent-content-desktop:
    name: Re-review adjacent production content journeys
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Stonecutter machine desktop journey
        shell: pwsh
        run: |
          $godotPath = (Get-Command godot).Source
          .\tests\ci\run_godot_desktop_test.ps1 `
            -Godot $godotPath `
            -ProjectRoot . `
            -ScriptPath 'res://tests/qa/stonecutter_machine_desktop_acceptance.gd' `
            -OutputPath 'build\stonecutter-machine-content-review.png' `
            -TimeoutMilliseconds 1800000

      - name: Husbandry desktop journey
        shell: pwsh
        run: |
          $godotPath = (Get-Command godot).Source
          .\tests\ci\run_godot_desktop_test.ps1 `
            -Godot $godotPath `
            -ProjectRoot . `
            -ScriptPath 'res://tests/qa/husbandry_desktop_acceptance.gd' `
            -OutputPath 'build\husbandry-content-review.png' `
            -TimeoutMilliseconds 1800000

      - name: Ranch products desktop journey
        shell: pwsh
        run: |
          $godotPath = (Get-Command godot).Source
          .\tests\ci\run_godot_desktop_test.ps1 `
            -Godot $godotPath `
            -ProjectRoot . `
            -ScriptPath 'res://tests/qa/ranch_products_desktop_acceptance.gd' `
            -OutputPath 'build\ranch-products-content-review.png' `
            -TimeoutMilliseconds 1800000

      - name: Repair desktop journey
        shell: pwsh
        run: |
          $godotPath = (Get-Command godot).Source
          .\tests\ci\run_godot_desktop_test.ps1 `
            -Godot $godotPath `
            -ProjectRoot . `
            -ScriptPath 'res://tests/qa/repair_desktop_acceptance.gd' `
            -OutputPath 'build\repair-content-review.png' `
            -TimeoutMilliseconds 1800000

      - name: Upload adjacent content evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adjacent-content-desktop-${{ github.run_number }}
          path: |
            build/stonecutter-machine-content-review.*
            build/husbandry-content-review.*
            build/ranch-products-content-review.*
            build/repair-content-review.*
          if-no-files-found: error
          retention-days: 21
