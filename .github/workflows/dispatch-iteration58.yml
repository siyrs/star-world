name: Dispatch Iteration 58 integrator

on:
  push:
    branches:
      - agent/iteration-58-long-term-scale-recovery
    paths:
      - '.github/workflows/dispatch-iteration58.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch production integrator at current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-iteration58.yml -R siyrs/star-world --ref agent/iteration-58-long-term-scale-recovery
