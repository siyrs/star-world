# Self-removing, branch-scoped exact patch. This second commit intentionally
# triggers the workflow after it already exists on the branch.
name: Temporary final journey contract patch

on:
  push:
    branches:
      - agent/complete-remaining-player-journeys

permissions:
  contents: write

concurrency:
  group: temporary-final-journey-contract-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-remaining-player-journeys
          fetch-depth: 0

      - name: Apply reviewed exact replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              file_path.write_text(content.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "tests/qa/agriculture_closed_loop_desktop_acceptance.gd",
              'inventory.call("add_item", "wooden_pickaxe", 1, {"fixture_slot":index})',
              'inventory.call(\n\t\t\t"add_item",\n\t\t\t"wooden_pickaxe",\n\t\t\t1,\n\t\t\t{"fixture_slot":"agriculture_%02d" % index},\n\t\t)',
              "canonical agriculture fixture metadata",
          )

          validator_path = Path("tests/developer_b/validate_remaining_player_journeys.ps1")
          validator = validator_path.read_text(encoding="utf-8")
          validator = validator.replace(
              "$restDesktop = Read-RepoFile 'tests/qa/rest_closed_loop_desktop_acceptance.gd'\n$workflow = Read-RepoFile '.github/workflows/remaining-player-journeys-tests.yml'\n",
              "$restDesktop = Read-RepoFile 'tests/qa/rest_closed_loop_desktop_acceptance.gd'\n$explorationDesktop = Read-RepoFile 'tests/qa/exploration_closed_loop_desktop_acceptance.gd'\n$continuousRoute = Read-RepoFile 'tests/qa/player_continuous_route_regression.gd'\n$workflow = Read-RepoFile '.github/workflows/remaining-player-journeys-tests.yml'\n",
              1,
          )
          anchor = "Require-NotContains $restDesktop 'world.call(\"remove_block\"' 'Rest journey may not bypass production mining to remove the bed'\n\n"
          addition = '''Require-NotContains $restDesktop 'world.call("remove_block"' 'Rest journey may not bypass production mining to remove the bed'

Require-Contains $explorationDesktop 'hub.get("exploration_reward_service")' 'Exploration journey must bind the production reward service'
Require-NotContains $explorationDesktop 'exploration_milestone_reward_service' 'Exploration journey may not use an invented service-hub property'
Require-Contains $explorationDesktop 'twelve real right clicks create twelve stable records' 'Exploration journey must use production input for all records'
Require-Contains $explorationDesktop 'immediate repeated right click emits a production cooldown rejection' 'Exploration journey must prove cooldown failure atomicity'
Require-Contains $explorationDesktop 'full-inventory reward failure cannot partially mutate any player slot' 'Exploration journey must prove reward failure atomicity'
Require-Contains $explorationDesktop 'all eight milestone rewards are claimed exactly once' 'Exploration journey must collect every configured reward'
Require-Contains $explorationDesktop 'reload does not replay scan or reward events' 'Exploration journey must suppress historical event replay'
Require-Contains $explorationDesktop '_save_image(image)' 'Exploration journey must retain visual evidence'

Require-Contains $continuousRoute 'PROFILE_IDS: Array[String]' 'Continuous route gate must enumerate production profiles'
Require-Contains $continuousRoute '_apply_target_steering' 'Continuous route execution must correct both axes toward block centres'
Require-Contains $continuousRoute 'TARGET_SPEED_TOLERANCE' 'Continuous route steps must arrive at bounded speed'
Require-Contains $continuousRoute '_transition_has_clearance' 'Continuous route planning must reject obstructed ascents'
Require-Contains $continuousRoute 'CHUNK_NEIGHBOURS' 'Continuous route collision must include diagonal neighbour chunks'
Require-Contains $continuousRoute 'Input.action_press' 'Continuous route execution must use production input actions'
Require-Contains $continuousRoute '"transport_after_spawn": false' 'Continuous route evidence must declare no post-spawn transport'
Require-NotContains $continuousRoute 'player.global_position =' 'Continuous route gate may not reposition the player after spawn'

'''
          if validator.count(anchor) != 1:
              raise RuntimeError("validator insertion anchor changed unexpectedly")
          validator = validator.replace(anchor, addition, 1)
          validator = validator.replace(
              "Require-Contains $agricultureDesktop '_save_image(image)' 'Agriculture journey must retain visual evidence'\n",
              "Require-Contains $agricultureDesktop '_save_image(image)' 'Agriculture journey must retain visual evidence'\nRequire-Contains $agricultureDesktop '{\"fixture_slot\":\"agriculture_%02d\" % index}' 'Agriculture full-inventory metadata must remain canonical across JSON'\n",
              1,
          )
          validator = validator.replace(
              "Require-Contains $workflow 'rest_closed_loop_desktop_acceptance.gd' 'Permanent CI must run the rest closed loop'\n",
              "Require-Contains $workflow 'rest_closed_loop_desktop_acceptance.gd' 'Permanent CI must run the rest closed loop'\nRequire-Contains $workflow 'exploration_closed_loop_desktop_acceptance.gd' 'Permanent CI must run the exploration closed loop'\nRequire-Contains $workflow 'player_continuous_route_regression.gd' 'Permanent CI must run five-profile continuous routes'\n",
              1,
          )
          validator = validator.replace(
              "Require-MinimumOccurrences $workflow \"      - 'tests/ci/run_godot_desktop_test.ps1'\" 2 'Desktop runner changes must trigger both pull-request and master-push gates'\n",
              "Require-MinimumOccurrences $workflow \"      - 'tests/ci/run_godot_desktop_test.ps1'\" 2 'Desktop runner changes must trigger both pull-request and master-push gates'\nRequire-MinimumOccurrences $workflow \"      - 'src/exploration/**'\" 2 'Exploration changes must trigger both pull-request and master-push gates'\nRequire-MinimumOccurrences $workflow \"      - 'tests/qa/player_continuous_route_regression.gd'\" 2 'Continuous-route changes must trigger both pull-request and master-push gates'\n",
              1,
          )
          validator = validator.replace(
              "Write-Host '  - bed spawn, real respawn, removal fallback and exact reload are covered'\nWrite-Host '  - production composition and permanent read-only CI are wired'\n",
              "Write-Host '  - bed spawn, real respawn, removal fallback and exact reload are covered'\nWrite-Host '  - complete exploration milestones, reward atomicity and reload are covered'\nWrite-Host '  - five-profile continuous routes use centred low-speed production steering'\nWrite-Host '  - production composition and permanent read-only CI are wired'\n",
              1,
          )
          validator_path.write_text(validator, encoding="utf-8", newline="\n")

      - name: Commit exact corrections and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "star-world-quality-bot"
          git config user.email "star-world-quality-bot@users.noreply.github.com"
          git rm .github/workflows/temporary-final-journey-contract-patch.yml
          git add tests/qa/agriculture_closed_loop_desktop_acceptance.gd \
                  tests/developer_b/validate_remaining_player_journeys.ps1
          git diff --cached --check
          git commit -m "test: canonicalize agriculture fixture and lock final journeys"
          git push origin HEAD:agent/complete-remaining-player-journeys
