name: Fix Iteration 58 desktop qualification

on:
  push:
    branches:
      - agent/iteration-58-long-term-scale-recovery
    paths:
      - '.github/workflows/fix-iteration58-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-iteration-58-desktop
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Route joypad input through InputMap and respect clipping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/qa/ultrawide_high_dpi_controller_focus_desktop_acceptance.gd')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '\t\t_check(_all_visible_buttons_inside(settings_panel, visible_rect), "settings controls stay inside the ultrawide high-DPI viewport")',
                  '\t\t_check(\n\t\t\t_rect_inside(settings_panel.get_global_rect(), visible_rect),\n\t\t\t"settings workspace stays inside the ultrawide high-DPI viewport"\n\t\t)',
              ),
              (
                  '\t\t_check(next_settings_focus != null and next_settings_focus.visible, "controller navigation remains live inside the scrolled settings workspace")',
                  '\t\t_check(\n\t\t\tnext_settings_focus != null\n\t\t\tand next_settings_focus != settings_focus\n\t\t\tand next_settings_focus.visible\n\t\t\tand _rect_inside(next_settings_focus.get_global_rect(), visible_rect),\n\t\t\t"real controller navigation moves to a visible in-viewport settings target"\n\t\t)',
              ),
              ('\troot.push_input(press)', '\tInput.parse_input_event(press)'),
              ('\troot.push_input(release)', '\tInput.parse_input_event(release)'),
              (
                  'func _all_visible_buttons_inside(node: Node, viewport_rect: Rect2) -> bool:\n',
                  'func _rect_inside(rect: Rect2, outer: Rect2) -> bool:\n\treturn (\n\t\trect.size.x > 0.0\n\t\tand rect.size.y > 0.0\n\t\tand rect.position.x >= outer.position.x - 1.0\n\t\tand rect.position.y >= outer.position.y - 1.0\n\t\tand rect.end.x <= outer.end.x + 1.0\n\t\tand rect.end.y <= outer.end.y + 1.0\n\t)\n\n\nfunc _all_visible_buttons_inside(node: Node, viewport_rect: Rect2) -> bool:\n',
              ),
              (
                  '\t\tvar rect := button.get_global_rect()\n\t\tif (\n\t\t\trect.size.x <= 0.0\n\t\t\tor rect.size.y <= 0.0\n\t\t\tor rect.position.x < viewport_rect.position.x - 1.0\n\t\t\tor rect.position.y < viewport_rect.position.y - 1.0\n\t\t\tor rect.end.x > viewport_rect.end.x + 1.0\n\t\t\tor rect.end.y > viewport_rect.end.y + 1.0\n\t\t):\n\t\t\treturn false',
                  '\t\tvar rect := button.get_global_rect()\n\t\tif not _rect_inside(rect, viewport_rect):\n\t\t\treturn false',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one desktop fixture occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          pwsh -NoLogo -NoProfile -File tests/developer_b/validate_long_term_scale_recovery.ps1

      - name: Commit desktop qualification fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/qa/ultrawide_high_dpi_controller_focus_desktop_acceptance.gd
          git commit -m 'test: map joypad focus and honor clipped settings bounds'
          git push origin HEAD:agent/iteration-58-long-term-scale-recovery
