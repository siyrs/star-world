name: Bounded autosave and save-lifecycle quality gates

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: bounded-autosave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Pause-aware active time, manual deduplication, bounded retries and failed-return health retention
      domain_timeout_minutes: 75
      static_validators: |
        tests/developer_b/validate_bounded_autosave.ps1
        tests/developer_b/validate_service_hub_lifecycle.ps1
        tests/developer_b/validate_runtime_health_report.ps1
        tests/developer_b/validate_save_recovery.ps1
        tests/developer_b/validate_world_catalog.ps1
        tests/developer_b/validate_reusable_ci_workflows.ps1
      primary_headless_script: res://tests/qa/bounded_autosave_runtime_regression.gd
      primary_headless_output_base: build\bounded-autosave-runtime
      primary_headless_timeout_milliseconds: 600000
      domain_scripts: |
        res://tests/qa/settings_retest.gd
        res://tests/qa/service_hub_feature_lifecycle_regression.gd
        res://tests/qa/runtime_health_failed_return_regression.gd
        res://tests/qa/runtime_health_report_regression.gd
        res://tests/qa/save_recovery_regression.gd
        res://tests/qa/world_catalog_regression.gd
        res://tests/qa/integration_regression.gd
        res://tests/qa/ui_layout_regression.gd
        res://tests/qa/runtime_stability_regression.gd
      domain_artifact_name: bounded-autosave-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/bounded-autosave-runtime.stdout.log
        build/bounded-autosave-runtime.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real settings, pause exclusion, inventory checkpoint and visible autosave confirmation
      desktop_timeout_minutes: 90
      desktop_script: res://tests/qa/bounded_autosave_desktop_acceptance.gd
      desktop_output_path: build\bounded-autosave-desktop.png
      desktop_timeout_milliseconds: 900000
      desktop_artifact_name: bounded-autosave-evidence
      desktop_artifact_paths: |
        build/bounded-autosave-desktop.png
        build/bounded-autosave-desktop-settings.png
        build/bounded-autosave-desktop.json
        build/bounded-autosave-desktop.stdout.log
        build/bounded-autosave-desktop.stderr.log
      desktop_artifact_if_no_files: error
