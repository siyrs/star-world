name: Temporary adjust building fixture

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/temporary-adjust-building-fixture.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-readiness-closure
          fetch-depth: 0

      - name: Move collision fixture to eye height
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/qa/building_mining_closed_loop_desktop_acceptance.gd')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'var failure_anchor := Vector3i(origin.x, floor_y + 1, origin.z + 1)':
                  'var failure_anchor := Vector3i(origin.x, floor_y + 2, origin.z + 1)',
              '"failure_player_position": Vector3(origin.x + 0.5, floor_y + 1.05, origin.z + 2.5),':
                  '"failure_player_position": Vector3(origin.x + 0.5, floor_y + 1.05, origin.z + 2.45),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing fixture token: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-adjust-building-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/qa/building_mining_closed_loop_desktop_acceptance.gd
          git commit -m 'test: move placement-overlap fixture to eye height'
          git push origin HEAD:agent/release-readiness-closure
