name: Save browser virtualization quality gates

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: save-browser-virtualization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Fixed row pool, bounded pagination, cross-frame catalog settlement and adjacent persistence regressions
      domain_timeout_minutes: 75
      static_validators: |
        tests/developer_b/validate_virtualized_save_browser.ps1
        tests/developer_b/validate_transient_catalog_stage.ps1
        tests/developer_b/validate_bounded_authoritative_reads.ps1
        tests/developer_b/validate_bounded_catalog_rebuild.ps1
        tests/developer_b/validate_bounded_multi_world_recovery.ps1
        tests/developer_b/validate_world_catalog.ps1
        tests/developer_b/validate_save_recovery.ps1
        tests/developer_b/validate_reusable_ci_workflows.ps1
      primary_headless_script: res://tests/qa/save_browser_virtualization_regression.gd
      primary_headless_output_base: build\save-browser-virtualization-regression
      primary_headless_timeout_milliseconds: 600000
      domain_scripts: |
        res://tests/qa/bounded_authoritative_read_regression.gd
        res://tests/qa/catalog_stage_invalidation_regression.gd
        res://tests/qa/bounded_catalog_rebuild_regression.gd
        res://tests/qa/bounded_multi_world_recovery_regression.gd
        res://tests/qa/world_catalog_regression.gd
        res://tests/qa/save_recovery_regression.gd
        res://tests/qa/integration_regression.gd
        res://tests/qa/runtime_stability_regression.gd
      domain_artifact_name: save-browser-virtualization-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/save-browser-virtualization-regression.stdout.log
        build/save-browser-virtualization-regression.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real 72-world fixed row pool, pagination, automatic catalog settlement and steady refresh
      desktop_timeout_minutes: 90
      desktop_script: res://tests/qa/save_browser_virtualization_desktop_acceptance.gd
      desktop_output_path: build\save-browser-virtualization-desktop.png
      desktop_timeout_milliseconds: 900000
      desktop_artifact_name: save-browser-virtualization-evidence
      desktop_artifact_paths: |
        build/save-browser-virtualization-desktop.png
        build/save-browser-virtualization-desktop.json
        build/save-browser-virtualization-desktop.stdout.log
        build/save-browser-virtualization-desktop.stderr.log
      desktop_artifact_if_no_files: error
