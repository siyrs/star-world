name: Iteration 61 supporting evidence materializer

on:
  push:
    branches:
      - agent/iteration-61-release-candidate-chain
    paths:
      - '.github/workflows/iteration-61-supporting-evidence-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-61-release-candidate-chain
          fetch-depth: 0

      - name: Patch documentation
        shell: bash
        env:
          ROADMAP_OLD_B64: 
          ROADMAP_NEW_B64: 
          READINESS_OLD_B64: 
          READINESS_NEW_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          replacements = [
              (Path('docs/PRODUCT_ROADMAP.md'), 'ROADMAP_OLD_B64', 'ROADMAP_NEW_B64'),
              (Path('docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/11-readiness-gates.md'), 'READINESS_OLD_B64', 'READINESS_NEW_B64'),
          ]
          for path, old_key, new_key in replacements:
              text = path.read_text(encoding='utf-8')
              old = base64.b64decode(os.environ[old_key]).decode('utf-8')
              new = base64.b64decode(os.environ[new_key]).decode('utf-8')
              if old not in text:
                  raise SystemExit(f'replacement anchor missing: {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/iteration-61-supporting-evidence-materialize.yml').unlink()
          PY

      - name: Commit materialized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRODUCT_ROADMAP.md docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/11-readiness-gates.md .github/workflows/iteration-61-supporting-evidence-materialize.yml
          git commit -m "docs: complete iteration 61 supporting evidence chain"
          git push origin HEAD:agent/iteration-61-release-candidate-chain
