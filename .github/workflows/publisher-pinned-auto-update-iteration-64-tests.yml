name: Publisher-pinned auto-update quality gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/publisher-pinned-auto-update-iteration-64-tests.yml'
      - '.github/workflows/auto-update-tests.yml'
      - '.github/workflows/publish-windows-release.yml'
      - 'data/update_trust_policy.json'
      - 'src/update/**'
      - 'tools/build_update_release.ps1'
      - 'tools/new_update_manifest.ps1'
      - 'tools/sign_update_manifest.ps1'
      - 'tools/publish_signed_update_release.ps1'
      - 'tests/developer_b/validate_auto_update.ps1'
      - 'tests/developer_b/validate_publisher_pinned_auto_update_iteration_64.ps1'
      - 'tests/qa/auto_update_regression.gd'
      - 'tests/qa/windows_update_helper_acceptance.ps1'
      - 'tests/qa/windows_update_publisher_trust_acceptance.ps1'
      - 'tests/run_all.ps1'
      - 'docs/GITHUB_RELEASE_AUTO_UPDATE.md'
      - 'docs/PUBLISHER_PINNED_AUTO_UPDATE.md'
      - 'docs/PRODUCT_ROADMAP_ITERATION_64.md'
      - 'docs/ARCHITECTURE_AUDIT_2026-08-07_ITERATION_64.md'
      - 'docs/PRODUCT_ROADMAP.md'
      - 'docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publisher-pinned-auto-update-iteration-64-tests.yml'
      - '.github/workflows/auto-update-tests.yml'
      - '.github/workflows/publish-windows-release.yml'
      - 'data/update_trust_policy.json'
      - 'src/update/**'
      - 'tools/build_update_release.ps1'
      - 'tools/new_update_manifest.ps1'
      - 'tools/sign_update_manifest.ps1'
      - 'tools/publish_signed_update_release.ps1'
      - 'tests/developer_b/validate_auto_update.ps1'
      - 'tests/developer_b/validate_publisher_pinned_auto_update_iteration_64.ps1'
      - 'tests/qa/auto_update_regression.gd'
      - 'tests/qa/windows_update_helper_acceptance.ps1'
      - 'tests/qa/windows_update_publisher_trust_acceptance.ps1'
      - 'tests/run_all.ps1'
      - 'docs/GITHUB_RELEASE_AUTO_UPDATE.md'
      - 'docs/PUBLISHER_PINNED_AUTO_UPDATE.md'
      - 'docs/PRODUCT_ROADMAP_ITERATION_64.md'
      - 'docs/ARCHITECTURE_AUDIT_2026-08-07_ITERATION_64.md'
      - 'docs/PRODUCT_ROADMAP.md'
      - 'docs/tasks/20260731-v1.3.0-commercial-release-gameplay-polish/**'

permissions:
  contents: read

concurrency:
  group: publisher-pinned-auto-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publisher-pinned-updater:
    name: Current-install trust, signed manifest and pre-swap authentication
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate publisher-pinned updater contract
        shell: pwsh
        run: .\tests\developer_b\validate_publisher_pinned_auto_update_iteration_64.ps1

      - name: Exercise real publisher-pinned updater cryptography
        shell: pwsh
        run: .\tests\qa\windows_update_publisher_trust_acceptance.ps1

      - name: Exercise reference swap, ACK and rollback
        shell: pwsh
        run: .\tests\qa\windows_update_helper_acceptance.ps1

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Validate strict project import
        shell: pwsh
        run: .\tests\ci\Invoke-Godot.ps1 -Arguments '--headless --path . --editor --quit'

      - name: Run updater protocol regression
        shell: pwsh
        run: .\tests\ci\Invoke-Godot.ps1 -Arguments '--headless --path . --script res://tests/qa/auto_update_regression.gd -- --disable-update-check'

      - name: Upload updater trust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-pinned-auto-update-${{ github.run_number }}
          path: |
            build/auto-update-static-failure.txt
            build/windows-update-helper-failure.txt
          if-no-files-found: ignore
          retention-days: 21
