name: Temporary generator cache follow-up

on:
  push:
    branches:
      - agent/bounded-generator-column-cache

permissions:
  contents: write

concurrency:
  group: temporary-generator-cache-followup
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-generator-column-cache
          fetch-depth: 0

      - name: Apply reviewed footprint, telemetry and desktop benchmark changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              file_path.write_text(content.replace(old, new, 1), encoding="utf-8", newline="\n")

          regression = Path("tests/qa/world_generator_column_cache_regression.gd")
          content = regression.read_text(encoding="utf-8")
          content = content.replace(
              'const WORLD_HEIGHT := 64\n',
              'const WORLD_HEIGHT := 64\nconst MAX_HOT_PATH_COLUMN_FOOTPRINT := (HOT_PATH_SIZE + 4) * (HOT_PATH_SIZE + 4)\n',
              1,
          )
          content = content.replace(
              'cached_height_evaluations <= HOT_PATH_SIZE * HOT_PATH_SIZE,',
              'cached_height_evaluations <= MAX_HOT_PATH_COLUMN_FOOTPRINT,',
              1,
          )
          content = content.replace(
              'cached_sky_evaluations <= HOT_PATH_SIZE * HOT_PATH_SIZE,',
              'cached_sky_evaluations <= MAX_HOT_PATH_COLUMN_FOOTPRINT,',
              1,
          )
          old_entry_assertion = '''\t_check(
          \t\tint(cached_stats.get("entry_count", 0)) == HOT_PATH_SIZE * HOT_PATH_SIZE,
          \t\t"one hot chunk owns exactly one entry per X/Z column"
          \t)
          '''
          new_entry_assertion = '''\tvar retained_columns := int(cached_stats.get("entry_count", 0))
          \t_check(
          \t\tretained_columns >= HOT_PATH_SIZE * HOT_PATH_SIZE,
          \t\t"one hot chunk retains at least its two hundred fifty-six direct columns"
          \t)
          \t_check(
          \t\tretained_columns <= MAX_HOT_PATH_COLUMN_FOOTPRINT,
          \t\t"tree-canopy neighbour probes stay inside the bounded two-cell footprint"
          \t)
          '''
          if content.count(old_entry_assertion) != 1:
              raise RuntimeError("hot-path entry assertion changed unexpectedly")
          content = content.replace(old_entry_assertion, new_entry_assertion, 1)
          regression.write_text(content, encoding="utf-8", newline="\n")

          replace_once(
              "tests/qa/performance_scenario_capture.gd",
              '''\t\tsummary["streaming_pending"] = int(streaming.get("pending", -1))
          \t\tsummary["streaming_loaded"] = int(streaming.get("loaded", -1))
          ''',
              '''\t\tsummary["streaming_pending"] = int(streaming.get("pending", -1))
          \t\tsummary["streaming_loaded"] = int(streaming.get("loaded", -1))
          \t\tvar raw_column_cache: Variant = streaming.get("generator_column_cache", {})
          \t\tif raw_column_cache is Dictionary:
          \t\t\tsummary["generator_column_cache"] = (raw_column_cache as Dictionary).duplicate(true)
          ''',
              "performance cache telemetry",
          )

          replace_once(
              "tests/developer_b/validate_generator_column_cache.ps1",
              "Require-Contains $capture 'engine_fps_avg_diagnostic' 'Capture output must retain rolling FPS only as a diagnostic'\n",
              "Require-Contains $capture 'engine_fps_avg_diagnostic' 'Capture output must retain rolling FPS only as a diagnostic'\nRequire-Contains $capture 'generator_column_cache' 'Desktop performance report must retain live cache telemetry'\n",
              "validator cache report",
          )
          replace_once(
              "tests/developer_b/validate_generator_column_cache.ps1",
              "Require-Contains $workflow 'pull_request:' 'Quality gate must run automatically for relevant pull requests'\n",
              "Require-Contains $workflow 'pull_request:' 'Quality gate must run automatically for relevant pull requests'\nRequire-Contains $workflow 'performance-capture:' 'Quality gate must run a real desktop performance journey'\nRequire-Contains $workflow 'run_performance_capture.ps1' 'Desktop benchmark must use the existing external-memory driver'\n",
              "validator desktop benchmark",
          )

          workflow_path = Path(".github/workflows/generator-column-cache-performance-tests.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace(
              "      - 'tests/qa/performance_scenario_capture.gd'\n",
              "      - 'tests/qa/performance_scenario_capture.gd'\n      - 'tests/ci/run_performance_capture.ps1'\n",
              1,
          )
          desktop_job = '''
          
          
            performance-capture:
              name: Real desktop five-profile schema-v2 performance capture
              needs: quality-gate
              runs-on: windows-latest
              timeout-minutes: 70
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
          
                - name: Setup Godot
                  uses: chickensoft-games/setup-godot@v2
                  with:
                    version: 4.7.0
                    use-dotnet: false
                    include-templates: false
          
                - name: Validate isolated project import
                  shell: pwsh
                  run: .\\tests\\ci\\Invoke-Godot.ps1 -Arguments '--headless --path . --editor --quit' -TimeoutMilliseconds 600000
          
                - name: Capture five-profile frame-time and external-memory evidence
                  shell: pwsh
                  run: |
                    $godotPath = (Get-Command godot).Source
                    .\\tests\\ci\\run_performance_capture.ps1 `
                      -Godot $godotPath `
                      -ProjectRoot . `
                      -OutputDirectory 'build\\column-cache-perf'
          
                - name: Validate schema-v2 performance report
                  shell: pwsh
                  run: |
                    $reportPath = 'build\\column-cache-perf\\perf-report.json'
                    if (-not (Test-Path -LiteralPath $reportPath)) {
                      throw "Missing performance report: $reportPath"
                    }
                    $report = Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8 | ConvertFrom-Json
                    if ([int]$report.schema_version -ne 2) {
                      throw "Expected performance schema 2, got $($report.schema_version)"
                    }
                    $measured = @($report.scenarios | Where-Object { [int]$_.sample_count -gt 0 })
                    if ($measured.Count -lt 12) {
                      throw "Expected at least 12 measured scenarios, got $($measured.Count)"
                    }
                    foreach ($scenario in $measured) {
                      if ([string]$scenario.metric_schema -ne 'frame-time-tail-v2') {
                        throw "Scenario $($scenario.profile)/$($scenario.phase) has invalid metric schema"
                      }
                      if ([double]$scenario.avg_fps -le 0 -or [double]$scenario.one_percent_low_fps -le 0) {
                        throw "Scenario $($scenario.profile)/$($scenario.phase) has non-positive frame-time metrics"
                      }
                    }
                    $measured | Select-Object profile, phase, avg_fps, one_percent_low_fps, frame_ms_p95, frame_ms_p99, frame_budget_miss_60fps_percent | Format-Table -AutoSize
          
                - name: Upload desktop performance evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: generator-column-cache-performance-${{ github.run_number }}
                    path: |
                      build/column-cache-perf/**
                    if-no-files-found: error
                    retention-days: 21
          '''
          if '  performance-capture:' in workflow:
              raise RuntimeError('desktop performance job already exists')
          workflow += desktop_job
          workflow_path.write_text(workflow, encoding="utf-8", newline="\n")

      - name: Commit follow-up and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "star-world-quality-bot"
          git config user.email "star-world-quality-bot@users.noreply.github.com"
          git rm .github/workflows/temporary-generator-cache-followup.yml
          git add tests/qa/world_generator_column_cache_regression.gd \
                  tests/qa/performance_scenario_capture.gd \
                  tests/developer_b/validate_generator_column_cache.ps1 \
                  .github/workflows/generator-column-cache-performance-tests.yml
          git diff --cached --check
          git commit -m "test: bound cache neighbour footprint and capture desktop evidence"
          git push origin HEAD:agent/bounded-generator-column-cache
