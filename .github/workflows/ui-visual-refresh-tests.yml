name: Professional UI visual refresh quality gates

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ui-visual-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-convergence-patch:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/professional-ui-refresh
          fetch-depth: 0

      - name: Apply verified convergence fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_exact(
              "tests/qa/bounded_autosave_runtime_regression.gd",
              '''\t\tvar audio: Node = hub.get("audio_service") as Node
\t\tif audio != null and audio.has_method("shutdown"):
\t\t\taudio.call("shutdown")
\tif runtime != null and is_instance_valid(runtime):
\t\truntime.call("shutdown")
\tif hub != null and is_instance_valid(hub):
\t\thub.queue_free()
\tfor _frame in 5:
\t\tawait process_frame
''',
              '''\t\tvar audio: Node = hub.get("audio_service") as Node
\t\tif audio != null and audio.has_method("dispose"):
\t\t\taudio.call("dispose")
\t\t\t_check(
\t\t\t\tbool(audio.call("is_disposed")) and audio.get_child_count() == 0,
\t\t\t\t"autosave fixture disposes generated audio playback nodes",
\t\t\t)
\t\telif audio != null and audio.has_method("shutdown"):
\t\t\taudio.call("shutdown")
\tif runtime != null and is_instance_valid(runtime):
\t\truntime.call("shutdown")
\tif hub != null and is_instance_valid(hub):
\t\thub.queue_free()
\tfor _frame in 8:
\t\tawait process_frame
''',
          )

          replace_exact(
              "tests/qa/machine_base_regression.gd",
              '''\thub.save_service.delete_world(world_id)
\tif hub.audio_service != null and hub.audio_service.has_method("shutdown"):
\t\thub.audio_service.shutdown()
\thub.queue_free()
\tawait process_frame
\tawait process_frame
''',
              '''\thub.save_service.delete_world(world_id)
\tif hub.audio_service != null and hub.audio_service.has_method("dispose"):
\t\thub.audio_service.call("dispose")
\t\t_check(
\t\t\tbool(hub.audio_service.call("is_disposed"))
\t\t\tand hub.audio_service.get_child_count() == 0,
\t\t\t"machine fixture disposes generated audio playback nodes",
\t\t)
\telif hub.audio_service != null and hub.audio_service.has_method("shutdown"):
\t\thub.audio_service.call("shutdown")
\thub.queue_free()
\tfor _frame in 8:
\t\tawait process_frame
''',
          )

          replace_exact(
              "src/ui/furnace_panel.gd",
              'heading.add_child(UiKit.make_subtitle("机器由共享调度持续推进；关闭界面后继续加工，世界暂停时同步停止。"))',
              'heading.add_child(UiKit.make_subtitle("机器由共享调度推进；关闭界面后继续加工，世界暂停时同步停止。"))',
          )

          replace_exact(
              "src/ui/map_selection_panel.gd",
              '''func get_details_text() -> String:
\treturn _details.text if _details != null else ""
''',
              '''func get_details_text() -> String:
\tvar parts: Array[String] = []
\tif _details != null and not _details.text.is_empty():
\t\tparts.append(_details.text)
\tif _resource_summary_label != null and not _resource_summary_label.text.is_empty():
\t\tparts.append(_resource_summary_label.text)
\treturn "\\n".join(parts)
''',
          )

      - name: Commit final fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/qa/bounded_autosave_runtime_regression.gd \
            tests/qa/machine_base_regression.gd \
            src/ui/furnace_panel.gd \
            src/ui/map_selection_panel.gd
          git diff --cached --check
          git commit -m "fix: close final UI integration and cleanup gaps"
          git push origin HEAD:agent/professional-ui-refresh

  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Semantic design system, responsive hierarchy and adjacent UI regression
      domain_timeout_minutes: 85
      static_validators: |
        tests/developer_b/validate_ui_design_system.ps1
        tests/developer_b/validate_protected_save_deletion.ps1
        tests/developer_b/validate_bounded_autosave.ps1
        tests/developer_b/validate_runtime_health_report.ps1
        tests/developer_b/validate_exploration_journal.ps1
      primary_headless_script: res://tests/qa/ui_design_system_regression.gd
      primary_headless_output_base: build\ui-design-system-runtime
      primary_headless_timeout_milliseconds: 600000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/menu_keyboard_navigation_regression.gd
        res://tests/qa/ui_layout_regression.gd
        res://tests/qa/desktop_input_contract_regression.gd
        res://tests/qa/input_interaction_regression.gd
        res://tests/qa/inventory_transaction_regression.gd
        res://tests/qa/furnace_machine_regression.gd
        res://tests/qa/settings_retest.gd
        res://tests/qa/protected_save_browser_regression.gd
        res://tests/qa/trash_manager_panel_regression.gd
        res://tests/qa/exploration_journal_regression.gd
        res://tests/qa/runtime_health_report_regression.gd
        res://tests/qa/player_experience_regression.gd
        res://tests/qa/integration_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: ui-visual-refresh-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/ui-design-system-runtime.stdout.log
        build/ui-design-system-runtime.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real menu, subpage, HUD, modal, workspace and diagnostics visual acceptance
      desktop_timeout_minutes: 100
      desktop_script: res://tests/qa/ui_visual_refresh_desktop_acceptance.gd
      desktop_output_path: build\ui-visual-refresh-main-menu.png
      desktop_timeout_milliseconds: 1200000
      desktop_artifact_name: ui-visual-refresh-evidence
      desktop_artifact_paths: |
        build/ui-visual-refresh-main-menu.png
        build/ui-visual-refresh-map-selection.png
        build/ui-visual-refresh-settings.png
        build/ui-visual-refresh-save-browser.png
        build/ui-visual-refresh-gameplay-hud.png
        build/ui-visual-refresh-pause.png
        build/ui-visual-refresh-inventory.png
        build/ui-visual-refresh-crafting.png
        build/ui-visual-refresh-exploration-journal.png
        build/ui-visual-refresh-diagnostics.png
        build/ui-visual-refresh-report.json
        build/ui-visual-refresh-main-menu.stdout.log
        build/ui-visual-refresh-main-menu.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 14
