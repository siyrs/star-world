# Second branch commit intentionally triggers this already-installed workflow.
name: Temporary canonical exploration save patch

on:
  push:
    branches:
      - agent/complete-remaining-player-journeys

permissions:
  contents: write

concurrency:
  group: temporary-canonical-exploration-save-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-remaining-player-journeys
          fetch-depth: 0

      - name: Canonicalize raw saved inventory before exact comparison
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/qa/exploration_closed_loop_desktop_acceptance.gd')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              'const CaptureConfig = preload("res://tests/qa/desktop_capture_config.gd")\n',
              'const CaptureConfig = preload("res://tests/qa/desktop_capture_config.gd")\nconst InventoryScript = preload("res://src/inventory/inventory_service.gd")\n',
              'inventory preload',
            ),
            (
              '\t_check(loaded.get("inventory", {}) == claimed_inventory, "world.json stores the exact reward inventory")\n',
              '\t_check(\n\t\t_canonical_inventory_payload(loaded.get("inventory", {})) == claimed_inventory,\n\t\t"world.json restores the exact canonical reward inventory",\n\t)\n',
              'raw inventory assertion',
            ),
            (
              '\nfunc _station_centers(world: Node, player: Node3D) -> Array[Vector3i]:\n',
              '''
func _canonical_inventory_payload(raw_payload: Variant) -> Dictionary:
\tvar canonical = InventoryScript.new(36, 9)
\troot.add_child(canonical)
\tvar readable := canonical.deserialize(raw_payload)
\tvar result: Dictionary = canonical.serialize() if readable else {}
\tcanonical.queue_free()
\treturn result


func _station_centers(world: Node, player: Node3D) -> Array[Vector3i]:
''',
              'canonical helper insertion',
            ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          validator = Path('tests/developer_b/validate_remaining_player_journeys.ps1')
          value = validator.read_text(encoding='utf-8')
          anchor = "Require-Contains $explorationDesktop '_save_image(image)' 'Exploration journey must retain visual evidence'\n"
          addition = anchor + "Require-Contains $explorationDesktop '_canonical_inventory_payload(loaded.get(\"inventory\", {})) == claimed_inventory' 'Exploration world JSON must cross the canonical inventory boundary before exact comparison'\n"
          if value.count(anchor) != 1:
              raise RuntimeError('exploration validator anchor changed')
          validator.write_text(value.replace(anchor, addition, 1), encoding='utf-8', newline='\n')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "star-world-quality-bot"
          git config user.email "star-world-quality-bot@users.noreply.github.com"
          git rm .github/workflows/temporary-canonical-exploration-save.yml
          git add tests/qa/exploration_closed_loop_desktop_acceptance.gd \
                  tests/developer_b/validate_remaining_player_journeys.ps1
          git diff --cached --check
          git commit -m "test: compare exploration inventory through canonical JSON boundary"
          git push origin HEAD:agent/complete-remaining-player-journeys
