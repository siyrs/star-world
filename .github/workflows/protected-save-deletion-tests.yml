name: Protected save deletion quality gates

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: protected-save-deletion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Atomic bounded trash, conflict-safe restore, two-click confirmation and adjacent persistence regressions
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_protected_save_deletion.ps1
        tests/developer_b/validate_indexed_save_browser.ps1
        tests/developer_b/validate_virtualized_save_browser.ps1
        tests/developer_b/validate_transient_catalog_stage.ps1
        tests/developer_b/validate_bounded_authoritative_reads.ps1
        tests/developer_b/validate_bounded_catalog_rebuild.ps1
        tests/developer_b/validate_bounded_multi_world_recovery.ps1
        tests/developer_b/validate_save_recovery.ps1
        tests/developer_b/validate_world_catalog.ps1
        tests/developer_b/validate_reusable_ci_workflows.ps1
      primary_headless_script: res://tests/qa/protected_save_service_regression.gd
      primary_headless_output_base: build\protected-save-service-regression
      primary_headless_timeout_milliseconds: 900000
      domain_scripts: |
        res://tests/qa/protected_save_browser_regression.gd
        res://tests/qa/indexed_save_browser_regression.gd
        res://tests/qa/save_browser_virtualization_regression.gd
        res://tests/qa/catalog_stage_invalidation_regression.gd
        res://tests/qa/bounded_authoritative_read_regression.gd
        res://tests/qa/bounded_catalog_rebuild_regression.gd
        res://tests/qa/bounded_multi_world_recovery_regression.gd
        res://tests/qa/save_recovery_regression.gd
        res://tests/qa/world_catalog_regression.gd
        res://tests/qa/integration_regression.gd
        res://tests/qa/runtime_stability_regression.gd
      domain_artifact_name: protected-save-deletion-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/protected-save-service-regression.stdout.log
        build/protected-save-service-regression.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real 12-world two-click confirmation, atomic trash, undo restore and hidden-selection safety
      desktop_timeout_minutes: 100
      desktop_script: res://tests/qa/protected_save_deletion_desktop_acceptance.gd
      desktop_output_path: build\protected-save-deletion-desktop.png
      desktop_timeout_milliseconds: 1200000
      desktop_artifact_name: protected-save-deletion-evidence
      desktop_artifact_paths: |
        build/protected-save-deletion-desktop.png
        build/protected-save-deletion-desktop-confirm.png
        build/protected-save-deletion-desktop-restored.png
        build/protected-save-deletion-desktop.json
        build/protected-save-deletion-desktop.stdout.log
        build/protected-save-deletion-desktop.stderr.log
      desktop_artifact_if_no_files: error
