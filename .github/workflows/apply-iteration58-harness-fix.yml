name: Apply Iteration 58 harness fix

on:
  push:
    branches:
      - agent/iteration-58-long-term-scale-recovery
    paths:
      - '.github/workflows/apply-iteration58-harness-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-iteration-58-harness-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply and validate SceneTree controller dispatch
        shell: bash
        run: |
          set -euo pipefail
          python .iteration58-harness-patch.py
          git diff --check
          pwsh -NoLogo -NoProfile -File tests/developer_b/validate_long_term_scale_recovery.ps1

      - name: Commit harness dispatch fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/qa/ultrawide_high_dpi_controller_focus_desktop_acceptance.gd tests/developer_b/validate_long_term_scale_recovery.ps1
          git commit -m 'test: dispatch D-pad events through production focus handler'
          git push origin HEAD:agent/iteration-58-long-term-scale-recovery
