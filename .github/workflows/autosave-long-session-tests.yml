name: Long-session autosave scheduling quality gates

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: autosave-long-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-godot-quality-gate.yml
    with:
      domain_job_name: Fixed-point scheduling, bounded overshoot carry, long-session rollover and recovery
      domain_timeout_minutes: 90
      static_validators: |
        tests/developer_b/validate_autosave_long_session.ps1
        tests/developer_b/validate_bounded_autosave.ps1
        tests/developer_b/validate_save_checkpoint_timeline.ps1
        tests/developer_b/validate_runtime_health_report.ps1
      primary_headless_script: res://tests/qa/autosave_long_session_endurance_regression.gd
      primary_headless_output_base: build\autosave-long-session-runtime
      primary_headless_timeout_milliseconds: 900000
      primary_headless_verbose: true
      domain_scripts: |
        res://tests/qa/bounded_autosave_runtime_regression.gd
        res://tests/qa/autosave_deferred_pause_race_regression.gd
        res://tests/qa/save_checkpoint_timeline_regression.gd
        res://tests/qa/world_scoped_save_checkpoint_session_regression.gd
        res://tests/qa/runtime_health_failed_return_regression.gd
        res://tests/qa/runtime_health_report_regression.gd
        res://tests/qa/runtime_soak_regression.gd
        res://tests/qa/ui_layout_regression.gd
      domain_scripts_verbose: true
      domain_artifact_name: autosave-long-session-domain
      domain_artifact_paths: |
        build/reusable-ci-static-validators.log
        build/autosave-long-session-runtime.stdout.log
        build/autosave-long-session-runtime.stderr.log
        build/reusable-ci-domain-*.stdout.log
        build/reusable-ci-domain-*.stderr.log
      domain_artifact_if_no_files: error
      desktop_job_name: Real repeated checkpoints, manual interleave, three-tier backoff and visual recovery
      desktop_timeout_minutes: 120
      desktop_script: res://tests/qa/autosave_long_session_desktop_acceptance.gd
      desktop_output_path: build\autosave-long-session-backoff.png
      desktop_timeout_milliseconds: 1200000
      desktop_artifact_name: autosave-long-session-evidence
      desktop_artifact_paths: |
        build/autosave-long-session-backoff.png
        build/autosave-long-session-recovered.png
        build/autosave-long-session-report.json
        build/autosave-long-session-backoff.stdout.log
        build/autosave-long-session-backoff.stderr.log
      desktop_artifact_if_no_files: error
      retention_days: 14
